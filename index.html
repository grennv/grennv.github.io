<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özel Navigasyon</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 40px;
            color: #4285F4;
            font-weight: 700;
        }
        .nav-btn {
            width: 100%;
            padding: 22px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #222831;
            border: 2px solid #393e46;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .nav-btn:active {
            transform: scale(0.97);
            background-color: #4285F4;
            border-color: #4285F4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SABİT ROTA</h1>
        
        <!-- Eve Git Butonu -->
        <button class="nav-btn" onclick="startNav('home')">
            🏠 Eve Git
        </button>
        
        <!-- İşe Git Butonu -->
        <button class="nav-btn" onclick="startNav('work')">
            💼 İşe Git
        </button>
    </div>

    <script>
        function startNav(type) {
            if (type === 'home') {
                // İşten Eve: Onayladığın doğrudan harita linki
                window.location.href = "https://maps.app.goo.gl/suCTMth3t5fvdwBk7";
            } else {
                // Evden İşe: Onayladığın doğrudan harita linki
                window.location.href = "https://maps.app.goo.gl/8YfAAg8tAri6AzxN9";
            }
        }
    </script>
</body>
</html>
