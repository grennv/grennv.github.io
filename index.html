<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mutfak Şefi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#070b13;color:#e9effb;padding:10px 10px 60px;font-size:14px;line-height:1.4}
h1{font-size:16px;font-weight:800;color:#fbbf24;padding:4px 0}
h2{font-size:14px;font-weight:800;margin:14px 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;color:#647790;background:#111a2b;padding:3px 7px;border-radius:99px}
.wrap{max-width:900px;margin:auto}
input,select,textarea{font-family:inherit;font-size:13px;background:#111a2b;color:#e9effb;border:1px solid #22304d;border-radius:9px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:#f97316}
.btn{cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;background:#1b2843;color:#e9effb;border:1px solid #22304d;border-radius:9px;padding:9px 13px;white-space:nowrap;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.orange{background:linear-gradient(135deg,#f97316,#fbbf24);color:#1a0a02;border:none}
.btn.green{background:linear-gradient(135deg,#34d399,#22d3ee);color:#04170f;border:none}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;border:none}
.btn.purple{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border:none}
.btn.red{background:#7f1d1d;border-color:#991b1b;color:#fca5a5}
.btn.sm{padding:6px 10px;font-size:11px}
.btn.full{width:100%}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.row input{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px}
.ing{background:#16213a;border:1px solid #22304d;border-radius:10px;padding:8px;cursor:pointer;font-size:12px;user-select:none;transition:.15s;text-align:left;color:#e9effb;font-family:inherit;position:relative}
.ing:active{transform:scale(.97)}
.ing.have{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.7)}
.ing.dis{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.5);opacity:.6}
.ing-name{font-weight:700;margin-top:2px;line-height:1.2;word-break:break-word}
.ing-emoji{font-size:16px}
.ing-loc{position:absolute;top:4px;right:4px;font-size:10px;opacity:.7}
.cook{width:100%;padding:15px;font-size:15px;font-weight:800;background:linear-gradient(135deg,#f97316,#fbbf24);color:#1a0a02;border:none;border-radius:14px;margin:12px 0;cursor:pointer;font-family:inherit;text-align:center}
.cook small{display:block;font-size:11px;font-weight:600;opacity:.85;margin-top:3px}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.recipe{background:#16213a;border:1px solid #22304d;border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:6px;position:relative}
.recipe.can{border-color:rgba(52,211,153,.55);background:linear-gradient(135deg,rgba(52,211,153,.08),#16213a)}
.recipe.almost{border-color:rgba(251,191,36,.5)}
.recipe .badge{position:absolute;top:0;right:0;font-size:9px;font-weight:800;padding:4px 9px;border-bottom-left-radius:10px;text-transform:uppercase}
.recipe.can .badge{background:rgba(52,211,153,.25);color:#34d399}
.recipe.almost .badge{background:rgba(251,191,36,.22);color:#fbbf24}
.recipe.no .badge{background:rgba(120,120,140,.15);color:#647790}
.recipe .emoji{font-size:26px;line-height:1;margin-top:10px}
.recipe h3{font-size:14px;font-weight:800;line-height:1.2}
.recipe .desc{font-size:11.5px;color:#8ba0c2;line-height:1.4}
.recipe .pills{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.pill{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:99px;background:rgba(255,255,255,.05);color:#8ba0c2}
.pill.ok{background:rgba(52,211,153,.13);color:#34d399}
.pill.miss{background:rgba(248,113,113,.12);color:#fca5a5}
.recipe .meta{font-size:10.5px;color:#647790;font-weight:700;margin-top:auto;padding-top:6px;border-top:1px solid #22304d}
.recipe .acts{display:flex;gap:4px;margin-top:6px}
.recipe .acts button{flex:1;cursor:pointer;font-family:inherit;font-weight:700;font-size:10.5px;background:#1b2843;color:#8ba0c2;border:1px solid #22304d;border-radius:7px;padding:6px 4px}
.recipe .acts .fav-on{color:#fb7185;background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.4)}
.list-item{display:flex;align-items:center;gap:9px;background:#16213a;border:1px solid #22304d;border-radius:10px;padding:9px 11px;margin-bottom:5px}
.list-item .chk{width:22px;height:22px;border-radius:7px;border:2px solid #3a4763;background:transparent;color:transparent;cursor:pointer;font-weight:900;font-size:12px;flex:none;font-family:inherit}
.list-item .chk.on{background:linear-gradient(135deg,#34d399,#22d3ee);border-color:transparent;color:#04170f}
.list-item .info{flex:1;min-width:0}
.list-item .name{font-weight:700;font-size:12.5px;word-break:break-word}
.list-item .sub{font-size:10.5px;color:#647790;margin-top:2px}
.list-item .del{background:transparent;border:none;color:#647790;cursor:pointer;font-size:14px;padding:4px;font-family:inherit}
.empty{text-align:center;padding:22px 12px;border:1.5px dashed #22304d;border-radius:12px;color:#647790;font-size:12.5px;line-height:1.6}
.empty .ico{font-size:30px;margin-bottom:6px;display:block;opacity:.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:10px}
.modal.show{display:flex}
.modal-box{background:#0d1526;border:1px solid #22304d;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto}
.modal-box.wide{max-width:720px}
.modal-head{padding:12px 15px;border-bottom:1px solid #22304d;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0d1526;z-index:1}
.modal-head h3{font-size:14.5px;font-weight:800;padding-right:10px}
.modal-head button{background:transparent;border:none;color:#8ba0c2;font-size:22px;cursor:pointer;padding:0 6px;font-family:inherit;line-height:1}
.modal-body{padding:13px 15px 18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}
.tab{cursor:pointer;font-family:inherit;font-weight:700;font-size:11px;background:#111a2b;color:#8ba0c2;border:1px solid #22304d;border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab.active{background:linear-gradient(135deg,rgba(249,115,22,.9),rgba(251,191,36,.8));color:#1a0a02;border-color:transparent}
.tab .tico{font-size:16px}
.panel{display:none}
.panel.active{display:block}
.serv{display:flex;align-items:center;gap:8px;background:#070b13;border-radius:10px;padding:10px;border:1px solid #22304d;margin:10px 0;flex-wrap:wrap}
.serv .lbl{font-size:11px;font-weight:800;color:#647790;text-transform:uppercase;flex:1;min-width:100px}
.serv .ctrl{display:flex;align-items:center;gap:5px}
.serv .ctrl button{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f97316,#fbbf24);color:#1a0a02;border:none;font-weight:900;font-size:16px;cursor:pointer;font-family:inherit}
.serv .ctrl input{width:48px;text-align:center;font-weight:800;font-size:15px;padding:6px 3px}
.ing-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;margin:8px 0}
.ing-list li{display:flex;gap:6px;align-items:center;font-size:12px;background:#070b13;border:1px solid #22304d;border-radius:8px;padding:7px 9px}
.ing-list li.has{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.06)}
.ing-list li.miss{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.06)}
.ing-list .amt{font-weight:800;color:#22d3ee;font-size:11px;flex:none}
.ing-list .nm{flex:1;word-break:break-word}
.steps{padding-left:20px;margin-top:8px;line-height:1.7;font-size:12.5px;color:#8ba0c2}
.steps li{margin-bottom:6px}
.note-box{margin-top:10px;padding:10px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);border-radius:10px}
.note-box label{display:block;font-size:10.5px;font-weight:800;color:#22d3ee;text-transform:uppercase;margin-bottom:5px}
.note-box textarea{min-height:55px;resize:vertical;font-size:12.5px}
.toast{position:fixed;bottom:12px;left:12px;right:12px;background:linear-gradient(135deg,#152239,#0f1728);border:1px solid #22304d;border-left:3px solid #22d3ee;border-radius:12px;padding:11px 13px;z-index:999;font-size:13px;max-width:400px;margin:auto;box-shadow:0 10px 30px -10px rgba(0,0,0,.9)}
.toast.good{border-left-color:#34d399}.toast.warn{border-left-color:#fbbf24}.toast.bad{border-left-color:#f87171}
video{width:100%;border-radius:10px;background:#000;display:block;max-height:60vh;object-fit:cover}
.detect{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:10px}
.detect-item{display:flex;gap:6px;align-items:center;background:#16213a;border:1px solid #22304d;border-radius:9px;padding:8px}
.detect-item.ok{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
.detect-item .chk{width:22px;height:22px;border-radius:7px;border:2px solid #3a4763;background:transparent;color:transparent;cursor:pointer;flex:none;font-weight:900;font-family:inherit;font-size:11px}
.detect-item .chk.on{background:linear-gradient(135deg,#34d399,#22d3ee);border-color:transparent;color:#04170f}
.hint{font-size:11.5px;color:#8ba0c2;line-height:1.5;margin:8px 0;text-align:center}
.loading{text-align:center;padding:30px 20px}
.loading .sp{width:38px;height:38px;border:3.5px solid rgba(249,115,22,.2);border-top-color:#f97316;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:#8ba0c2;font-size:12.5px}
.stat{background:#16213a;border:1px solid #22304d;border-radius:11px;padding:10px 12px;margin-bottom:7px}
.stat span{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;color:#647790;margin-bottom:3px}
.stat b{font-size:16px;font-weight:800}
.stat.cy b{color:#f97316}.stat.c3 b{color:#34d399}.stat.c4 b{color:#fbbf24}.stat.c1 b{color:#22d3ee}.stat.c5 b{color:#fb7185}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.macro{background:#16213a;border:1px solid #22304d;border-radius:11px;padding:9px;text-align:center}
.macro b{display:block;font-size:17px;font-weight:800;color:#22d3ee}
.macro span{font-size:9.5px;color:#647790;text-transform:uppercase;font-weight:700}
.badge-card{padding:10px 8px;border-radius:11px;background:#16213a;border:1px solid #22304d;text-align:center;opacity:.4}
.badge-card.earned{opacity:1;border-color:rgba(251,191,36,.5);background:linear-gradient(135deg,rgba(251,191,36,.08),#16213a)}
.badge-card .be{font-size:24px;margin-bottom:3px}
.badge-card .bn{font-size:10.5px;font-weight:800;line-height:1.2}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}
#errorBox{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px 12px;z-index:9999;font-size:11px;font-family:monospace;display:none;white-space:pre-wrap;max-height:40vh;overflow-y:auto}
@media(max-width:480px){.grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}.recipe-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="errorBox"></div>
<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <h1>👨‍🍳 Mutfak Şefi</h1>
    <div class="row" style="margin:0">
      <button class="btn sm" id="themeBtn">🌙</button>
      <button class="btn sm" id="setBtn">⚙️</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-t="ana"><span class="tico">🏠</span>Ana</button>
    <button class="tab" data-t="diyet"><span class="tico">🥗</span>Diyet</button>
    <button class="tab" data-t="istat"><span class="tico">📊</span>İstat</button>
    <button class="tab" data-t="sosyal"><span class="tico">👥</span>Sosyal</button>
  </div>

  <div class="panel active" id="p-ana">
    <div class="row">
      <button class="btn orange" id="camBtn">📷 Dolabı Tara</button>
      <button class="btn" id="shopBtn">🛒 Alışveriş <span id="shopBadge"></span></button>
      <button class="btn" id="photoBtn">📸 Albüm</button>
    </div>
    <h2>🥕 Malzemeler <span class="tag" id="ingCount">0</span></h2>
    <div class="row">
      <input id="search" placeholder="🔍 Ara...">
      <button class="btn sm" id="clearBtn">🧹</button>
    </div>
    <div class="grid" id="ingGrid"></div>

    <button class="cook" id="cookBtn">👨‍🍳 Ne Yapabilirim?<small id="cookSub">Malzeme seç 👆</small></button>

    <div id="recipeArea" style="display:none">
      <h2>🍽️ Tarifler <span class="tag" id="recipeSub"></span></h2>
      <div class="row" id="filterRow">
        <button class="btn sm" data-mf="all">Hepsi</button>
        <button class="btn sm" data-mf="fav">⭐</button>
        <button class="btn sm" data-mf="veg">🌿</button>
        <button class="btn sm" data-mf="vegan">🌱</button>
        <button class="btn sm" data-mf="hizli">⚡</button>
        <button class="btn sm" data-mf="tatli">🍰</button>
      </div>
      <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <h2>📖 Geçmiş <span class="tag" id="histCount"></span></h2>
    <div id="histList"></div>
  </div>

  <div class="panel" id="p-diyet">
    <h2>🥗 Diyet & Hedefler</h2>
    <div id="dietArea"></div>
  </div>

  <div class="panel" id="p-istat">
    <h2>📊 İstatistik</h2>
    <div id="statsArea"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn blue sm" id="marketBtn">🛍️ Market Fiyat</button>
      <button class="btn purple sm" id="planBtn">📅 Haftalık Plan</button>
      <button class="btn sm" id="eduBtn">🎓 Eğitim</button>
    </div>
  </div>

  <div class="panel" id="p-sosyal">
    <h2>🏆 Rozetler <span class="tag" id="badgeCount"></span></h2>
    <div class="badges-grid" id="badgesGrid"></div>
    <h2>👨‍👩‍👧 Aile</h2>
    <div class="row">
      <input id="famName" placeholder="İsim" style="flex:1">
      <input id="famEmoji" placeholder="😀" maxlength="2" style="max-width:60px">
      <button class="btn orange sm" id="famAdd">Ekle</button>
    </div>
    <div id="famList"></div>
    <h2>🎁 Puan</h2>
    <div id="pointsArea"></div>
  </div>
</div>

<div class="modal" id="detailModal"><div class="modal-box wide">
  <div class="modal-head"><h3 id="dTitle">Tarif</h3><button id="dClose">✕</button></div>
  <div class="modal-body" id="dBody"></div>
</div></div>

<div class="modal" id="shopModal"><div class="modal-box">
  <div class="modal-head"><h3>🛒 Alışveriş</h3><button id="sClose">✕</button></div>
  <div class="modal-body">
    <div class="row"><input id="sInput" placeholder="Ürün ekle..."><button class="btn orange sm" id="sAdd">Ekle</button></div>
    <div class="row"><button class="btn sm" id="sClear">Alınanları Temizle</button><button class="btn sm" id="sCopy">📋 Kopyala</button></div>
    <div id="sList"></div>
  </div>
</div></div>

<div class="modal" id="camModal"><div class="modal-box">
  <div class="modal-head"><h3>📷 Dolabı Tara</h3><button id="cClose">✕</button></div>
  <div class="modal-body" id="cBody"></div>
</div></div>

<div class="modal" id="photoModal"><div class="modal-box">
  <div class="modal-head"><h3>📸 Albüm</h3><button id="phClose">✕</button></div>
  <div class="modal-body">
    <button class="btn orange full" id="phAdd" style="margin-bottom:10px">📷 Fotoğraf Ekle</button>
    <input type="file" id="phFile" accept="image/*" style="display:none">
    <div class="photo-grid" id="photoGrid"></div>
  </div>
</div></div>

<div class="modal" id="marketModal"><div class="modal-box">
  <div class="modal-head"><h3>🛍️ Market Fiyat Karşılaştırma</h3><button id="mkClose">✕</button></div>
  <div class="modal-body">
    <div class="row"><select id="mkIng"><option value="">Malzeme seç...</option></select></div>
    <div id="mkResult"></div>
  </div>
</div></div>

<div class="modal" id="planModal"><div class="modal-box wide">
  <div class="modal-head"><h3>📅 Haftalık Plan</h3><button id="plClose">✕</button></div>
  <div class="modal-body">
    <div id="plannerGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px"></div>
    <div class="row"><button class="btn green sm" id="plShop">🛒 Eksikleri Alışverişe Ekle</button><button class="btn sm" id="plClear">🗑️ Temizle</button></div>
  </div>
</div></div>

<div class="modal" id="pickModal"><div class="modal-box">
  <div class="modal-head"><h3>🍽️ Tarif Seç</h3><button id="pkClose">✕</button></div>
  <div class="modal-body">
    <div class="row"><input id="pkSearch" placeholder="🔍 Ara..."></div>
    <div id="pkList"></div>
  </div>
</div></div>

<div class="modal" id="eduModal"><div class="modal-box wide">
  <div class="modal-head"><h3>🎓 Yemek Eğitimi</h3><button id="edClose">✕</button></div>
  <div class="modal-body" id="eduBody"></div>
</div></div>

<div class="modal" id="setModal"><div class="modal-box">
  <div class="modal-head"><h3>⚙️ Ayarlar</h3><button id="stClose">✕</button></div>
  <div class="modal-body">
    <div class="row"><button class="btn sm" id="notifBtn">🔔 Bildirim</button><button class="btn sm" id="voiceBtn">🎙️ Sesli</button></div>
    <div class="row"><button class="btn blue sm" id="expBtn">📥 Yedek Al</button><button class="btn blue sm" id="impBtn">📤 Yükle</button><button class="btn red sm" id="resetBtn">🗑️ Sıfırla</button></div>
    <input type="file" id="impFile" accept=".json" style="display:none">
  </div>
</div></div>

<script>
// Hata yakalayıcı
window.onerror = function(msg, url, line) {
  var box = document.getElementById('errorBox');
  if (box) {
    box.style.display = 'block';
    box.textContent += 'HATA: ' + msg + ' (satır ' + line + ')\n';
  }
  return false;
};

(function(){
'use strict';

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
    .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/İ/g, 'i');
}

var toastEl = null;
function toast(title, body, type) {
  if (toastEl) toastEl.remove();
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + (body ? '<div style="font-size:12px;color:#8ba0c2;margin-top:4px">' + esc(body) + '</div>' : '');
  document.body.appendChild(el);
  toastEl = el;
  setTimeout(function() { if (toastEl === el) { el.remove(); toastEl = null; } }, 3000);
}

// ==== VERİ: MALZEMELER ====
var INGS = [
  ['kiyma','Dana Kıyma','🥩'],['kuzu_kiyma','Kuzu Kıyma','🥩'],['kofte','Köfte','🍖'],
  ['kusbasi','Kuşbaşı','🥩'],['tavuk','Tavuk','🍗'],['tavuk_gogsu','Tavuk Göğsü','🍗'],
  ['dana_doner','Dana Döner','🌯'],['tavuk_doner','Tavuk Döner','🌯'],
  ['balik','Balık','🐟'],['somon','Somon','🐟'],['ton','Ton Balığı','🐟'],
  ['sucuk','Sucuk','🌭'],['sosis','Sosis','🌭'],['salam','Salam','🥓'],['pastirma','Pastırma','🥓'],

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function have() {
  var a = [];
  for (var id in S.pantry) {
    if (S.pantry[id] === 'have' && ING[id]) a.push(id);
  }
  return a;
}
function dislikes() {
  var a = [];
  for (var id in S.pantry) {
    if (S.pantry[id] === 'dis') a.push(id);
  }
  return a;
}

// ==== PUAN ====
function addPoints(n) {
  S.points += n; save(); renderPoints(); checkBadges();
}
function levelFrom(p) {
  var lv = [0,50,150,300,500,800,1200,1800,2500,3500,5000];
  var l = 1;
  for (var i=0;i<lv.length;i++) if (p>=lv[i]) l=i+1;
  return Math.min(l, lv.length);
}
function checkBadges() {
  for (var i=0;i<BADGES.length;i++) {
    var b = BADGES[i];
    if (S.badges[b.id]) continue;
    var earned = false;
    if (b.id === 'b1') earned = S.hist.length >= 1;
    else if (b.id === 'b2') earned = S.hist.length >= 5;
    else if (b.id === 'b3') earned = S.hist.length >= 25;
    else if (b.id === 'b4') earned = S.hist.length >= 50;
    else if (b.id === 'b5') earned = have().length >= 10;
    else if (b.id === 'b6') earned = have().length >= 30;
    else if (b.id === 'b7') earned = have().length >= 60;
    else if (b.id === 'b8') earned = S.fav.length >= 5;
    else if (b.id === 'b9') earned = S.fav.length >= 15;
    else if (b.id === 'b10') earned = S.streak.count >= 3 || S.streak.best >= 3;
    else if (b.id === 'b11') earned = S.streak.best >= 7;
    else if (b.id === 'b12') earned = S.photos.length >= 1;
    else if (b.id === 'b13') earned = S.family.length >= 1;
    else if (b.id === 'b14') earned = S.points >= 100;
    else if (b.id === 'b15') earned = S.points >= 500;
    if (earned) {
      S.badges[b.id] = Date.now();
      save();
      toast('🏆 Rozet kazandın!', b.e + ' ' + b.n, 'good');
    }
  }
  renderBadges();
}

function speak(t) {
  if (!S.voiceOn) return;
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'tr-TR'; u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }
  } catch(e){}
}

// ==== PORSİYON ====
function scale(id, f) {
  var def = AMT[id];
  if (!def) return '';
  var m = def.match(/^([\d.,]+)\s*(.*)$/);
  if (!m) return def;
  var num = parseFloat(m[1].replace(',', '.'));
  if (isNaN(num)) return def;
  var sc = num * f;
  var d;
  if (Math.abs(sc - Math.round(sc)) < 0.01) d = Math.round(sc).toString();
  else d = sc.toFixed(1).replace('.', ',');
  return d + ' ' + m[2];
}

// ==== SKOR ====
function score(r) {
  var h = {}, d = {};
  var hv = have(); for (var i=0;i<hv.length;i++) h[hv[i]] = 1;
  var dv = dislikes(); for (var j=0;j<dv.length;j++) d[dv[j]] = 1;
  for (var k=0;k<r.i.length;k++) {
    if (d[r.i[k]]) return null;
  }
  var miss = [], match = [];
  for (var m=0;m<r.i.length;m++) {
    if (h[r.i[m]]) match.push(r.i[m]);
    else miss.push(r.i[m]);
  }
  return { r: r, match: match, miss: miss, can: miss.length === 0, ratio: match.length / r.i.length };
}

function updateCookBtn() {
  var h = have();
  var can = 0, alm = 0;
  for (var i=0;i<RECIPES.length;i++) {
    var sc = score(RECIPES[i]);
    if (!sc || sc.match.length === 0) continue;
    if (sc.can) can++;
    else if (sc.miss.length <= 2) alm++;
  }
  var sub = $('cookSub');
  if (h.length === 0) sub.textContent = 'Önce malzeme seç 👆';
  else if (can) sub.textContent = h.length + ' malzeme • ' + can + ' tarif hazır!';
  else if (alm) sub.textContent = h.length + ' malzeme • ' + alm + ' tarif için 1-2 eksik';
  else sub.textContent = h.length + ' malzeme seçili';
}

function renderRecipes() {
  if (!recipesOpen) return;
  var h = {}; var hv = have();
  for (var i=0;i<hv.length;i++) h[hv[i]] = 1;
  var list = [];
  for (var j=0;j<RECIPES.length;j++) {
    var sc = score(RECIPES[j]);
    if (!sc || sc.match.length === 0) continue;
    var r = RECIPES[j];
    if (S.filter === 'fav' && S.fav.indexOf(r.id) === -1) continue;
    if (S.filter === 'veg' && !r.veg) continue;
    if (S.filter === 'vegan' && !r.vegan) continue;
    if (S.filter === 'hizli' && r.mood !== 'hizli') continue;
    if (S.filter === 'tatli' && r.mood !== 'tatli') continue;
    list.push(sc);
  }
  list.sort(function(a,b) {
    if (a.can && !b.can) return -1;
    if (!a.can && b.can) return 1;
    return a.miss.length - b.miss.length;
  });
  var canCount = 0, almCount = 0;
  for (var c=0;c<list.length;c++) {
    if (list[c].can) canCount++;
    else if (list[c].miss.length <= 2) almCount++;
  }
  $('recipeSub').textContent = canCount + ' hazır • ' + almCount + ' için 1-2 eksik';
  if (!list.length) {
    $('recipeGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="ico">🥲</span><b>Bu malzemelerle tarif bulunamadı</b><br>Farklı malzemeler seç.</div>';
    return;
  }
  var html = '';
  for (var k=0;k<list.length;k++) {
    var x = list[k];
    var r = x.r;
    var hSet = {};
    for (var mi=0;mi<x.match.length;mi++) hSet[x.match[mi]] = 1;
    var pills = '';
    for (var ii=0;ii<r.i.length;ii++) {
      var info = ING[r.i[ii]];
      var nm = info ? info.n : r.i[ii];
      if (hSet[r.i[ii]]) pills += '<span class="pill ok">✓ ' + esc(nm) + '</span>';
      else pills += '<span class="pill miss">' + esc(nm) + '</span>';
    }
    var cls = x.can ? 'can' : (x.miss.length <= 2 ? 'almost' : 'no');
    var badge = x.can ? '✓ Hazır' : x.miss.length + ' eksik';
    var isFav = S.fav.indexOf(r.id) !== -1;
    html += '<div class="recipe ' + cls + '">';
    html += '<span class="badge">' + badge + '</span>';
    html += '<div class="emoji">' + r.e + '</div>';
    html += '<h3>' + esc(r.n) + '</h3>';
    html += '<div class="desc">' + esc(r.d) + '</div>';
    html += '<div class="pills">' + pills + '</div>';
    html += '<div class="meta">⏱️ ' + r.t + ' • 🎯 ' + r.z + '</div>';
    html += '<div class="acts">';
    html += '<button data-act="show" data-rid="' + r.id + '">📖 Tarif</button>';
    html += '<button data-act="fav" data-rid="' + r.id + '" class="' + (isFav ? 'fav-on' : '') + '">' + (isFav ? '★' : '☆') + ' Favori</button>';
    html += '</div>';
    html += '</div>';
  }
  $('recipeGrid').innerHTML = html;
}

$('recipeGrid').onclick = function(e) {
  var btn = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!btn) return;
  var rid = btn.getAttribute('data-rid');
  var r = null;
  for (var i=0;i<RECIPES.length;i++) if (RECIPES[i].id === rid) r = RECIPES[i];
  if (!r) return;
  var act = btn.getAttribute('data-act');
  if (act === 'show') showDetail(r);
  else if (act === 'fav') {
    var idx = S.fav.indexOf(rid);
    if (idx > -1) S.fav.splice(idx, 1);
    else S.fav.push(rid);
    save(); renderRecipes(); addPoints(2);
  }
};

// ==== TARİF DETAY ====
var curRecipe = null, curServ = 2;

function showDetail(r) {
  curRecipe = r;
  curServ = S.servings || 2;
  renderDetail();
  $('detailModal').classList.add('show');
}

function renderDetail() {
  var r = curRecipe; if (!r) return;
  var h = {}; var hv = have();
  for (var i=0;i<hv.length;i++) h[hv[i]] = 1;
  var factor = curServ / 2;
  var note = S.notes[r.id] || '';
  var ingHtml = '';
  var miss = [];
  for (var j=0;j<r.i.length;j++) {
    var id = r.i[j];
    var info = ING[id]; if (!info) continue;
    var isH = !!h[id];
    var amt = scale(id, factor);
    if (!isH) miss.push(id);
    ingHtml += '<li class="' + (isH ? 'has' : 'miss') + '">';
    ingHtml += '<span class="amt">' + esc(amt || '') + '</span>';
    ingHtml += '<span class="nm">' + info.e + ' ' + esc(info.n) + '</span>';
    ingHtml += '<span>' + (isH ? '✓' : '✗') + '</span></li>';
  }
  var stepsHtml = '';
  if (r.steps) {
    stepsHtml = '<ol class="steps">';
    for (var s=0;s<r.steps.length;s++) stepsHtml += '<li>' + esc(r.steps[s]) + '</li>';
    stepsHtml += '</ol>';
  }
  var missNames = '';
  for (var m=0;m<miss.length;m++) {
    missNames += (m > 0 ? ', ' : '') + (ING[miss[m]] ? ING[miss[m]].n : miss[m]);
  }
  $('dTitle').textContent = r.e + ' ' + r.n;
  $('dBody').innerHTML =
    '<div style="font-size:12.5px;color:#8ba0c2;line-height:1.5;margin-bottom:10px">' + esc(r.d) + '</div>' +
    '<div style="font-size:11.5px;color:#647790;font-weight:700;margin-bottom:10px">⏱️ ' + r.t + ' • 🎯 ' + r.z + '</div>' +
    '<div class="serv">' +
      '<span class="lbl">👥 Kişi</span>' +
      '<div class="ctrl">' +
        '<button id="sM">−</button>' +
        '<input type="number" id="sIn" value="' + curServ + '" min="1" max="20">' +
        '<button id="sP">+</button>' +
      '</div>' +
    '</div>' +
    '<div style="font-size:11px;font-weight:800;color:#647790;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">🧂 Malzemeler (' + curServ + ' kişilik)</div>' +
    '<ul class="ing-list">' + ingHtml + '</ul>' +
    (miss.length
      ? '<div style="padding:9px;border-radius:9px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);font-size:12px;margin:8px 0">🛒 <b style="color:#fbbf24">Eksik:</b> ' + esc(missNames) + '</div>'
      : '<div style="padding:9px;border-radius:9px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);font-size:12px;margin:8px 0">✅ <b style="color:#34d399">Her şey elinde!</b></div>') +
    '<div style="margin-top:12px"><b style="color:#e9effb;font-size:13px">📋 Yapılışı:</b>' + stepsHtml + '</div>' +
    '<div class="note-box"><label>📝 Kendi Notun</label><textarea id="noteIn" placeholder="Örn: tuzunu az koy...">' + esc(note) + '</textarea></div>' +
    '<div class="row" style="margin-top:12px">' +
      (miss.length ? '<button class="btn orange sm" id="aMiss" style="flex:1">🛒 Eksikleri Alışverişe Ekle</button>' : '') +
      '<button class="btn green sm" id="mCooked" style="flex:1">✓ Pişirdim</button>' +
      '<button class="btn sm" id="closeD">Kapat</button>' +
    '</div>';

  $('sIn').oninput = function() {
    var v = parseInt(this.value);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 20) v = 20;
    curServ = v; S.servings = v; save(); renderDetail();
  };
  $('sM').onclick = function() { if (curServ > 1) { curServ--; S.servings = curServ; save(); renderDetail(); } };
  $('sP').onclick = function() { if (curServ < 20) { curServ++; S.servings = curServ; save(); renderDetail(); } };
  $('closeD').onclick = function() { $('detailModal').classList.remove('show'); };
  $('noteIn').oninput = function() { S.notes[r.id] = this.value; save(); };

  var amb = $('aMiss');
  if (amb) amb.onclick = function() {
    var f = curServ / 2;
    var added = 0;
    for (var i=0;i<miss.length;i++) {
      var id = miss[i];
      var info = ING[id]; if (!info) continue;
      var amt = scale(id, f);
      var name = (amt ? amt + ' ' : '') + info.n;
      var exists = false;
      for (var j=0;j<S.shop.length;j++) if (S.shop[j].name.toLowerCase() === name.toLowerCase()) exists = true;
      if (exists) continue;
      S.shop.push({id:'s' + Date.now() + Math.random(), name: name, src: r.n, done: false});
      added++;
    }
    save(); renderShop(); updateShopBadge();
    toast('🛒 Eklendi', added + ' malzeme alışveriş listesine', 'good');
    $('detailModal').classList.remove('show');
  };

  $('mCooked').onclick = function() {
    S.hist.unshift({
      id: 'h' + Date.now(),
      rid: r.id, name: r.n, e: r.e,
      date: new Date().toISOString(),
      servings: curServ
    });
    if (S.hist.length > 100) S.hist = S.hist.slice(0, 100);
    var today = new Date().toDateString();
    if (S.streak.last !== today) {
      var y = new Date(Date.now() - 86400000).toDateString();
      if (S.streak.last === y) S.streak.count++;
      else S.streak.count = 1;
      S.streak.last = today;
      if (S.streak.count > S.streak.best) S.streak.best = S.streak.count;
    }
    var month = new Date().toISOString().slice(0, 7);
    var cost = 0;
    for (var i=0;i<r.i.length;i++) cost += (PRICE[r.i[i]] || 30) * (curServ / 4);
    S.monthSpend[month] = (S.monthSpend[month] || 0) + cost;
    save();
    renderHistory(); addPoints(10); checkBadges(); renderStats();
    toast('Aferin şef! 🎉', r.e + ' ' + r.n + ' geçmişe eklendi', 'good');
    $('detailModal').classList.remove('show');
  };
}

$('sList').onclick = function(e) {
  var c = e.target.closest ? e.target.closest('[data-shchk]') : null;
  var d = e.target.closest ? e.target.closest('[data-shdel]') : null;
  if (c) {
    var id = c.getAttribute('data-shchk');

    save(); renderShop(); updateShopBadge();
  }

};

function getModel() {
  return new Promise(function(res, rej) {
    if (aiModel) { res(aiModel); return; }
    var tries = 0;
    var check = setInterval(function() {
      tries++;
      if (typeof mobilenet !== 'undefined') {
        clearInterval(check);
        mobilenet.load({version:2, alpha:1.0}).then(function(m) {
          aiModel = m;
          res(m);
        }).catch(rej);
      } else if (tries > 40) {
        clearInterval(check);
        rej(new Error('Model yüklenemedi'));
      }
    }, 250);
  });
}

$('camBtn').onclick = function() {
  $('camModal').classList.add('show');
  var body = $('cBody');
  body.innerHTML = '<div class="loading"><div class="sp"></div><p>📷 Kamera ve AI hazırlanıyor...<br>İlk seferde 10-15 sn sürebilir.</p></div>';
  getModel().then(function() {
    startCamera();
  }).catch(function() {
    body.innerHTML = '<div class="loading"><div style="font-size:36px">⚠️</div><p style="color:#fca5a5">Model yüklenemedi.<br>İnternet bağlantını kontrol et.</p><button class="btn orange" style="margin-top:14px" id="camRetry">🔄 Tekrar Dene</button></div>';

function startCamera() {
  var body = $('cBody');
  body.innerHTML =
    '<video id="vid" autoplay playsinline muted></video>' +
    '<div class="hint">📸 Kamerayı dolabına doğrult, sonra butona bas</div>' +
    '<div class="row" style="margin-top:10px">' +
      '<button class="btn orange" id="capBtn" style="flex:1">📷 Çek</button>' +

    '</div>' +
    '<canvas id="cv" style="display:none"></canvas>' +
    '<input type="file" accept="image/*" id="fileIn" style="display:none">';

  var facing = 'environment';
  var vid = $('vid');

  function start() {
    if (camStream) camStream.getTracks().forEach(function(t) { t.stop(); });
    navigator.mediaDevices.getUserMedia({
      video: {facingMode: facing, width: {ideal:1280}, height: {ideal:960}},
      audio: false
    }).then(function(s) {
      camStream = s;
      vid.srcObject = s;
      vid.play();
    }).catch(function() {
      body.innerHTML = '<div class="loading"><div style="font-size:36px">📷</div><p style="color:#fca5a5">Kamera açılamadı.<br>İzin ver ya da galeriden yükle.</p><button class="btn orange" style="margin-top:14px" id="galBtn2">🖼️ Galeriden Yükle</button></div>';

function classify(cv, imgUrl) {
  var body = $('cBody');
  body.innerHTML = '<div class="loading"><div class="sp"></div><p>🔬 Analiz ediliyor...</p></div>';
  getModel().then(function(m) {
    return m.classify(cv, 12);
  }).then(function(preds) {
    var seen = {}, results = [];
    for (var i=0;i<preds.length;i++) {
      var p = preds[i];
      var lbl = String(p.className || '').toLowerCase().trim();
      var id = null;
      if (LABEL_MAP[lbl]) id = LABEL_MAP[lbl];
      else {
        for (var key in LABEL_MAP) {
          if (lbl.indexOf(key) !== -1) { id = LABEL_MAP[key]; break; }
        }
      }
      if (id && !seen[id] && ING[id]) {
        seen[id] = 1;
        results.push({id: id, label: p.className, conf: p.probability});
      }
    }
    if (!results.length) {
      body.innerHTML = '<div class="loading"><div style="font-size:40px">🤔</div><p>Malzeme tanıyamadım.<br>Daha net fotoğraf dene.</p><button class="btn orange" style="margin-top:14px" id="camRetry2">📷 Tekrar</button></div>';
      $('camRetry2').onclick = function() { $('camBtn').onclick(); };
      return;
    }
    showDetect(imgUrl, results);
  }).catch(function() {
    body.innerHTML = '<div class="loading"><p style="color:#fca5a5">Analiz hatası</p><button class="btn orange" style="margin-top:12px" id="camRetry3">📷 Tekrar</button></div>';
    $('camRetry3').onclick = function() { $('camBtn').onclick(); };
  });
}

function showDetect(imgUrl, results) {
  var body = $('cBody');
  var selected = {};
  for (var i=0;i<results.length;i++) if (results[i].conf >= 0.3) selected[results[i].id] = 1;
  var html = '<img src="' + imgUrl + '" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover">';
  html += '<div class="hint">🔍 <b>' + results.length + ' malzeme</b> tanıdım. Doğru olanları işaretle:</div>';
  html += '<div class="detect">';
  for (var j=0;j<results.length;j++) {
    var r = results[j];
    var info = ING[r.id];
    var c = Math.round(r.conf * 100);
    var cls = c >= 50 ? 'ok' : '';
    var on = selected[r.id] ? 'on' : '';
    html += '<div class="detect-item ' + cls + '">';
    html += '<span style="font-size:18px">' + info.e + '</span>';
    html += '<div style="flex:1;min-width:0"><b style="font-size:12px">' + esc(info.n) + '</b><div style="font-size:10px;color:#647790">%' + c + '</div></div>';
    html += '<button class="chk ' + on + '" data-det="' + r.id + '">' + (on ? '✓' : '') + '</button>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="row" style="margin-top:12px"><button class="btn green" id="applyBtn" style="flex:1">✓ Seçilenleri Ekle</button><button class="btn" id="backBtn" style="flex:1">📷 Tekrar</button></div>';
  body.innerHTML = html;
  var detBtns = body.querySelectorAll('[data-det]');
  for (var k=0;k<detBtns.length;k++) {
    (function(b) {
      b.onclick = function() {
        var id = b.getAttribute('data-det');
        if (selected[id]) {
          delete selected[id];
          b.classList.remove('on');
          b.textContent = '';
        } else {
          selected[id] = 1;
          b.classList.add('on');
          b.textContent = '✓';
        }
      };
    })(detBtns[k]);
  }
  $('backBtn').onclick = function() { $('camBtn').onclick(); };
  $('applyBtn').onclick = function() {
    var ids = [];
    for (var key in selected) if (selected[key]) ids.push(key);
    if (!ids.length) { toast('Hiçbiri seçilmedi','','warn'); return; }
    var added = 0;
    for (var i=0;i<ids.length;i++) {
      if (S.pantry[ids[i]] !== 'have') { S.pantry[ids[i]] = 'have'; added++; }
    }
    save(); renderIngs(); updateCookBtn(); closeCam(); checkBadges();
    toast('🎉 ' + added + ' malzeme eklendi','','good');
  };
}

function renderDiet() {
  var today = new Date().toDateString();
  var todayMeals = [];
  for (var i=0;i<S.hist.length;i++) {
    if (new Date(S.hist[i].date).toDateString() === today) todayMeals.push(S.hist[i]);
  }
  var t = {c:0,p:0,f:0,ch:0};
  // Basit kalori hesabı
  for (var j=0;j<todayMeals.length;j++) {
    var h = todayMeals[j];
    var r = null;
    for (var k=0;k<RECIPES.length;k++) if (RECIPES[k].id === h.rid) r = RECIPES[k];
    if (!r) continue;
    t.c += 400 * (h.servings / 2);
    t.p += 20 * (h.servings / 2);
    t.f += 15 * (h.servings / 2);
    t.ch += 40 * (h.servings / 2);
  }
  var g = S.goals;
  function pct(a, b) { return Math.min(100, Math.round(a / b * 100)); }
  var html = '';
  html += '<div class="stat" style="text-align:center;background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(251,191,36,.1))"><div style="font-size:28px">🔥</div><b style="font-size:24px;color:#fbbf24">' + S.streak.count + ' gün</b><div style="font-size:11px;color:#647790;font-weight:700;text-transform:uppercase;margin-top:2px">Seri • En iyi: ' + S.streak.best + '</div></div>';
  html += '<div class="macro-grid">';
  html += '<div class="macro"><b>' + Math.round(t.c) + '</b><span>kcal</span></div>';
  html += '<div class="macro"><b>' + Math.round(t.p) + 'g</b><span>Prot</span></div>';
  html += '<div class="macro"><b>' + Math.round(t.ch) + 'g</b><span>Karb</span></div>';
  html += '<div class="macro"><b>' + Math.round(t.f) + 'g</b><span>Yağ</span></div>';
  html += '</div>';
  html += '<div class="stat c3"><span>Günlük Hedef</span><b>' + g.cal + ' kcal</b></div>';
  html += '<h2 style="margin-top:14px">💧 Su Takibi</h2>';
  html += '<div class="stat c1"><span>Bugün</span><b>' + S.water + ' / ' + g.water + ' bardak</b></div>';
  html += '<div class="row" style="margin-top:8px"><button class="btn green sm" id="wAdd">+ 1 Bardak</button><button class="btn sm" id="wReset">Sıfırla</button><button class="btn sm" id="goalEdit">⚙️ Hedef</button></div>';
  $('dietArea').innerHTML = html;
  $('wAdd').onclick = function() { S.water++; save(); checkBadges(); renderDiet(); };
  $('wReset').onclick = function() { S.water = 0; save(); renderDiet(); };
  $('goalEdit').onclick = function() {
    var c = prompt('Günlük kalori:', g.cal); if (c) g.cal = parseInt(c) || 2000;
    var p = prompt('Protein (g):', g.prot); if (p) g.prot = parseInt(p) || 50;
    var ch = prompt('Karbonhidrat (g):', g.ch); if (ch) g.ch = parseInt(ch) || 250;
    var f = prompt('Yağ (g):', g.fat); if (f) g.fat = parseInt(f) || 70;
    var w = prompt('Su (bardak):', g.water); if (w) g.water = parseInt(w) || 8;
    save(); renderDiet(); toast('Hedefler güncellendi ✅','','good');
  };
}

function renderStats() {
  var days = {};
  for (var i=13;i>=0;i--) {
    var d = new Date(Date.now() - i * 86400000).toDateString();
    days[d] = 0;
  }
  for (var j=0;j<S.hist.length;j++) {
    var dh = new Date(S.hist[j].date).toDateString();
    if (days[dh] !== undefined) days[dh]++;
  }
  var maxDay = 1;
  for (var key in days) if (days[key] > maxDay) maxDay = days[key];
  var html = '';
  html += '<div class="stat cy"><span>Toplam Pişirme</span><b>' + S.hist.length + '</b></div>';
  html += '<div class="stat c3"><span>En Uzun Seri</span><b>' + S.streak.best + ' 🔥</b></div>';
  html += '<div class="stat c4"><span>Şu Anki Seri</span><b>' + S.streak.count + '</b></div>';
  html += '<div class="stat c1"><span>Rozet</span><b>' + Object.keys(S.badges).length + '/' + BADGES.length + '</b></div>';
  html += '<h2 style="margin-top:14px">📊 Son 14 Gün</h2>';
  html += '<div style="display:flex;align-items:flex-end;gap:3px;height:100px;padding:8px;background:#16213a;border-radius:11px;border:1px solid #22304d">';
  var keys = Object.keys(days);
  for (var k=0;k<keys.length;k++) {
    var cnt = days[keys[k]];
    var pct = (cnt / maxDay) * 100;
    html += '<div style="flex:1;background:linear-gradient(180deg,#22d3ee,#0e7490);border-radius:4px 4px 0 0;height:' + Math.max(pct, 4) + '%;min-height:4px" title="' + new Date(keys[k]).toLocaleDateString('tr-TR') + ': ' + cnt + '"></div>';

  html += '</div>';
  $('statsArea').innerHTML = html;
}

  var id = d.getAttribute('data-pd');
  for (var i=0;i<S.photos.length;i++) if (S.photos[i].id === id) { S.photos.splice(i, 1); break; }
  save(); renderPhotos();
};

// ==== MARKET FİYAT ====
$('marketBtn').onclick = function() {
  var sel = $('mkIng');
  var opts = '<option value="">Malzeme seç...</option>';
  for (var i=0;i<INGS.length;i++) {
    if (PRICE[INGS[i][0]]) opts += '<option value="' + INGS[i][0] + '">' + INGS[i][2] + ' ' + INGS[i][1] + '</option>';
  }
  sel.innerHTML = opts;
  renderMarket('');
  $('marketModal').classList.add('show');
};
$('mkClose').onclick = function() { $('marketModal').classList.remove('show'); };
$('marketModal').onclick = function(e) { if (e.target.id === 'marketModal') $('marketModal').classList.remove('show'); };
$('mkIng').onchange = function(e) { renderMarket(e.target.value); };
function renderMarket(id) {
  var box = $('mkResult');
  if (!id) {
    box.innerHTML = '<div class="hint">Bir malzeme seç, marketlere göre tahmini fiyatı gör.</div>';
    return;
  }
  var base = PRICE[id] || 30;
  var markets = [
    {n:'🛒 A101', m:0.92}, {n:'🟠 BİM', m:0.90}, {n:'🟡 ŞOK', m:0.95},
    {n:'🔵 Migros', m:1.15}, {n:'🟢 Carrefour', m:1.08}, {n:'🔴 Hakmar', m:0.88}
  ];
  markets.sort(function(a, b) { return (base * a.m) - (base * b.m); });
  var min = base * markets[0].m;
  var html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-top:8px">';
  for (var i=0;i<markets.length;i++) {
    var mk = markets[i];
    var p = base * mk.m;
    var cls = i === 0 ? 'best' : '';
    html += '<div class="stat ' + (i === 0 ? 'c3' : '') + '">';
    html += '<span>' + mk.n + '</span>';
    html += '<b>' + p.toFixed(0) + ' ₺</b>';
    if (i === 0) html += '<div style="font-size:10px;color:#34d399;font-weight:700">🏆 En Ucuz</div>';
    else html += '<div style="font-size:10px;color:#647790">+' + ((p / min - 1) * 100).toFixed(0) + '%</div>';
    html += '</div>';
  }
  html += '</div><div style="font-size:10.5px;color:#647790;margin-top:8px;text-align:center">* Tahmini fiyatlar</div>';
  box.innerHTML = html;
}

// ==== PLAN ====
var DAYS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
$('planBtn').onclick = function() { renderPlanner(); $('planModal').classList.add('show'); };
$('plClose').onclick = function() { $('planModal').classList.remove('show'); };
$('planModal').onclick = function(e) { if (e.target.id === 'planModal') $('planModal').classList.remove('show'); };
function renderPlanner() {
  var html = '';
  for (var i=0;i<DAYS.length;i++) {
    var meals = S.planner[i] || [];
    html += '<div style="background:#16213a;border:1px solid #22304d;border-radius:9px;padding:6px;min-height:80px">';
    html += '<div style="font-size:10px;font-weight:800;color:#22d3ee;text-align:center;margin-bottom:4px">' + DAYS[i] + '</div>';
    for (var j=0;j<meals.length;j++) {
      var r = null;
      for (var k=0;k<RECIPES.length;k++) if (RECIPES[k].id === meals[j]) r = RECIPES[k];
      if (r) html += '<div data-pd="' + i + '" data-pi="' + j + '" style="font-size:10px;padding:3px 4px;border-radius:5px;background:rgba(255,255,255,.05);margin-bottom:2px;cursor:pointer;line-height:1.2">' + r.e + ' ' + esc(r.n) + '</div>';
    }
    html += '<div data-padd="' + i + '" style="font-size:9.5px;color:#647790;text-align:center;cursor:pointer;padding:3px;border:1px dashed #22304d;border-radius:5px">+ Ekle</div>';
    html += '</div>';
  }
  $('plannerGrid').innerHTML = html;
}
$('plannerGrid').onclick = function(e) {
  var a = e.target.closest ? e.target.closest('[data-padd]') : null;
  if (a) { openPick(parseInt(a.getAttribute('data-padd'))); return; }
  var m = e.target.closest ? e.target.closest('[data-pd]') : null;
  if (m) {
    var d = parseInt(m.getAttribute('data-pd'));
    var i = parseInt(m.getAttribute('data-pi'));
    if (confirm('Kaldırılsın mı?')) {
      S.planner[d].splice(i, 1);
      if (!S.planner[d].length) delete S.planner[d];
      save(); renderPlanner();
    }
  }
};
function openPick(day) {
  $('pickModal').classList.add('show');
  function render(q) {
    var html = '';
    var cnt = 0;
    for (var i=0;i<RECIPES.length;i++) {
      var r = RECIPES[i];
      if (q && norm(r.n).indexOf(norm(q)) === -1) continue;
      if (cnt >= 60) break;
      html += '<div class="list-item" data-pk="' + r.id + '" style="cursor:pointer">';
      html += '<span style="font-size:20px">' + r.e + '</span>';
      html += '<div class="info"><div class="name">' + esc(r.n) + '</div><div class="sub">' + r.t + ' • ' + r.z + '</div></div>';
      html += '</div>';
      cnt++;
    }
    $('pkList').innerHTML = html;
  }
  render('');
  $('pkSearch').value = '';
  $('pkSearch').oninput = function(e) { render(e.target.value); };
  $('pkList').onclick = function(e) {
    var it = e.target.closest ? e.target.closest('[data-pk]') : null;
    if (!it) return;
    var id = it.getAttribute('data-pk');
    if (!S.planner[day]) S.planner[day] = [];
    S.planner[day].push(id);
    save(); $('pickModal').classList.remove('show'); renderPlanner();
    toast('Plana eklendi 📅','','good');
  };
}
$('pkClose').onclick = function() { $('pickModal').classList.remove('show'); };
$('pickModal').onclick = function(e) { if (e.target.id === 'pickModal') $('pickModal').classList.remove('show'); };
$('plShop').onclick = function() {
  var h = {}; var hv = have();
  for (var i=0;i<hv.length;i++) h[hv[i]] = 1;
  var needed = {};
  for (var d in S.planner) {
    var arr = S.planner[d];
    for (var j=0;j<arr.length;j++) {
      var r = null;
      for (var k=0;k<RECIPES.length;k++) if (RECIPES[k].id === arr[j]) r = RECIPES[k];
      if (!r) continue;
      for (var m=0;m<r.i.length;m++) if (!h[r.i[m]]) needed[r.i[m]] = 1;
    }
  }
  var keys = Object.keys(needed);
  if (!keys.length) { toast('Eksik yok','','good'); return; }
  var added = 0;
  for (var n=0;n<keys.length;n++) {
    var id = keys[n];
    var info = ING[id]; if (!info) continue;
    var amt = AMT[id] || '';
    var name = (amt ? amt + ' ' : '') + info.n;
    var exists = false;
    for (var p=0;p<S.shop.length;p++) if (S.shop[p].name.toLowerCase() === name.toLowerCase()) exists = true;
    if (exists) continue;
    S.shop.push({id: 's' + Date.now() + Math.random(), name: name, src: 'Plan', done: false});
    added++;
  }
  save(); renderShop(); updateShopBadge();
  toast('🛒 Eklendi', added + ' malzeme', 'good');
};
$('plClear').onclick = function() {
  if (!confirm('Plan silinsin mi?')) return;
  S.planner = {}; save(); renderPlanner();
};

// ==== EĞİTİM ====
$('eduBtn').onclick = function() {
  var html = '';
  for (var i=0;i<TECHNIQUES.length;i++) {
    var t = TECHNIQUES[i];
    html += '<div class="stat"><b style="font-size:13px">' + t.n + '</b><div style="font-size:11.5px;color:#8ba0c2;line-height:1.5;margin-top:4px">' + t.d + '</div></div>';
  }
  $('eduBody').innerHTML = html;
  $('eduModal').classList.add('show');
};
$('edClose').onclick = function() { $('eduModal').classList.remove('show'); };
$('eduModal').onclick = function(e) { if (e.target.id === 'eduModal') $('eduModal').classList.remove('show'); };

// ==== AYARLAR ====
$('setBtn').onclick = function() { $('setModal').classList.add('show'); };
$('stClose').onclick = function() { $('setModal').classList.remove('show'); };
$('setModal').onclick = function(e) { if (e.target.id === 'setModal') $('setModal').classList.remove('show'); };
$('notifBtn').onclick = function() {
  if (!('Notification' in window)) { toast('Desteklenmiyor','','warn'); return; }
  if (Notification.permission === 'granted') { toast('Zaten açık ✅','','good'); return; }
  Notification.requestPermission().then(function(p) {
    if (p === 'granted') {
      toast('Açık ✅','','good');
      try { new Notification('🎉 Mutfak Şefi','Bildirimler çalışıyor!'); } catch(e) {}
    }
  });
};
$('voiceBtn').onclick = function() {
  S.voiceOn = !S.voiceOn;
  save();
  toast('Sesli okuma ' + (S.voiceOn ? 'açık 🔊' : 'kapalı 🔇'), '', S.voiceOn ? 'good' : 'warn');
  if (S.voiceOn) speak('Sesli okuma açık');
};
$('expBtn').onclick = function() {
  var b = new Blob([JSON.stringify(S)], {type:'application/json'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u;
  a.download = 'mutfak-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(u);
  toast('💾 Yedek alındı','','good');
};
$('impBtn').onclick = function() { $('impFile').click(); };
$('impFile').onchange = function(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var d = JSON.parse(ev.target.result);
      for (var k in d) S[k] = d[k];
      save(); renderAll();
      toast('✅ Yedek yüklendi','','good');
    } catch(err) {
      toast('❌ Hatalı dosya','','bad');
    }
  };
  r.readAsText(f);
};
$('resetBtn').onclick = function() {
  if (!confirm('TÜM veriler silinsin mi?')) return;
  if (!confirm('Emin misin? Geri alınamaz!')) return;
  localStorage.removeItem(KEY);
  location.reload();
};

// ==== TABS ====
var tabs = document.querySelectorAll('.tab');
for (var ti=0;ti<tabs.length;ti++) {
  (function(t) {
    t.onclick = function() {
      for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
      t.classList.add('active');
      var name = t.getAttribute('data-t');
      var panels = document.querySelectorAll('.panel');
      for (var j=0;j<panels.length;j++) panels[j].classList.remove('active');
      var p = $('p-' + name);
      if (p) p.classList.add('active');
      if (name === 'diyet') renderDiet();
      else if (name === 'istat') renderStats();
      else if (name === 'sosyal') { renderBadges(); renderFamily(); renderPoints(); }
    };
  })(tabs[ti]);
}

// ==== BAŞLAT ====
function renderAll() {
  applyTheme();
  renderIngs();
  renderHistory();
  renderShop();
  updateShopBadge();
  updateCookBtn();
  renderBadges();
  renderFamily();
  renderPoints();
}

renderAll();
setTimeout(function() { getModel().catch(function() {}); }, 2500);

})();
</script>
