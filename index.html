<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Burger House 3D v6.5 — Multiplayer Fix</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0f1020;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  .hidden{display:none!important}
  .svg-ico{width:1.2em;height:1.2em;vertical-align:middle;display:inline-block}
  .svg-ico.xl{width:52px;height:52px}
  
  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;padding:calc(env(safe-area-inset-top) + 10px) 12px}
  #topBar{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
  .pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(12,14,28,.68);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px}
  .pill b{font-size:17px;font-weight:800;color:#7dffb0}
  #rolePill{padding:8px 14px;border-radius:999px;color:#fff;font-size:13px;font-weight:800;border:1px solid rgba(255,255,255,.2);background:rgba(40,60,120,.7);display:flex;align-items:center;gap:6px}
  #rolePill.chef{background:rgba(180,60,40,.75)}
  #rolePill.waiter{background:rgba(40,120,180,.75)}
  #rolePill.courier{background:rgba(140,40,180,.75)}
  #quitBtn{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,120,120,.4);background:rgba(120,20,30,.6);color:#fff;font-size:12px;font-weight:700;cursor:pointer;pointer-events:auto}
  #stockBar{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 55px);display:flex;gap:4px;background:rgba(12,14,28,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 8px;flex-wrap:wrap;max-width:220px}
  .stock-item{display:flex;flex-direction:column;align-items:center;padding:3px 5px;border-radius:8px;background:rgba(255,255,255,.06);min-width:34px}
  .stock-item svg{width:20px;height:20px}
  .stock-item b{font-size:11px;color:#fff;font-weight:800}
  .stock-item.low b{color:#ff9f4d}
  .stock-item.empty b{color:#ff5a5f}
  
  /* Sol Menü */
  #sideMenu{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 200px);display:flex;flex-direction:column;gap:8px;pointer-events:auto;z-index:12}
  .side-btn{padding:12px 16px;border-radius:12px;background:linear-gradient(180deg,#4aa8ff,#1a5a9a);color:#fff;border:2px solid rgba(255,255,255,.3);font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .1s}
  .side-btn:active{transform:scale(.95)}
  .side-btn.courier{background:linear-gradient(180deg,#b07cff,#6a3a9a)}
  .side-btn.settings{background:linear-gradient(180deg,#888,#444)}
  .side-btn.upgrade{background:linear-gradient(180deg,#ffd84d,#d4a800);color:#1a1400}

  #ordersPanel{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 55px);width:min(170px,42vw);background:rgba(12,14,28,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px;max-height:50vh;overflow-y:auto}
  #ordersPanel .ptitle{font-size:10px;letter-spacing:2px;color:#9fb0d0;font-weight:800;text-align:center;margin-bottom:6px}
  .order-row{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.08);margin-bottom:4px;font-size:11px;color:#fff}
  .order-row.waiting{background:rgba(255,200,80,.2)}
  .order-row.eating{background:rgba(80,200,120,.2)}
  .order-row.paying{background:rgba(255,100,100,.25)}
  .order-row.angry{background:rgba(200,40,40,.35)}
  #heldPanel{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 100px);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:rgba(12,14,28,.85);border:2px solid rgba(255,215,100,.6);backdrop-filter:blur(10px);z-index:13}
  .held-name{font-size:13px;font-weight:800;color:#ffd84d}
  #crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 8px rgba(0,0,0,.6)}
  #crosshair.active{background:#7dffb0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;box-shadow:0 0 14px #7dffb0}
  #prompt{position:absolute;left:50%;top:56%;transform:translateX(-50%);padding:6px 16px;border-radius:10px;background:rgba(12,14,28,.85);border:1px solid rgba(125,255,176,.5);color:#7dffb0;font-size:13px;font-weight:800;white-space:nowrap;backdrop-filter:blur(6px);display:flex;align-items:center;gap:6px}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 180px);color:#fff;font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;background:rgba(12,14,28,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);opacity:0;transition:opacity .25s;white-space:nowrap;z-index:20}
  #hint.show{opacity:1}
  #toasts{position:absolute;left:50%;top:30%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  .toast{font-size:16px;font-weight:800;color:#7dffb0;text-shadow:0 2px 10px rgba(0,0,0,.8);transition:all .5s ease;white-space:nowrap}
  .toast.gold{color:#ffd84d}
  
  /* Telefon Çalıyor */
  #phoneRing{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:20px;background:rgba(12,14,28,.95);padding:16px 24px;border-radius:20px;border:2px solid #ff5a5f;box-shadow:0 10px 40px rgba(255,90,95,.4);animation:ring 0.5s infinite alternate}
  @keyframes ring { from { transform: translateX(-50%) rotate(-2deg); } to { transform: translateX(-50%) rotate(2deg); } }
  .phone-btn{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .phone-btn.accept{background:#5ad98a}
  .phone-btn.reject{background:#ff5a5f}
  
  /* Interact Button */
  #interactBtn{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:72px;height:72px;border-radius:50%;z-index:12;background:radial-gradient(circle at 35% 30%,#8fe6ff,#4aa8ff);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(74,168,255,.55),inset 0 -4px 0 rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.4);cursor:pointer;transition:transform .1s}
  #interactBtn:active{transform:scale(.92)}
  #interactBtn.pulse{animation:ipulse .8s infinite alternate}
  @keyframes ipulse{to{box-shadow:0 6px 30px rgba(74,255,170,.8),inset 0 -4px 0 rgba(0,0,0,.2)}}
  #interactBtn svg{width:38px;height:38px}
  #joyBase{position:fixed;width:130px;height:130px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);transform:translate(-50%,-50%);pointer-events:none;z-index:11;backdrop-filter:blur(4px);opacity:0;transition:opacity .12s}
  #joyBase.on{opacity:1}
  #joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(150,180,255,.8));box-shadow:0 4px 16px rgba(0,0,0,.4)}
  
  /* Modallar */
  .modal{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,18,.75);backdrop-filter:blur(8px);pointer-events:auto}
  .modal-content{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;background:linear-gradient(180deg,#1a2240,#0e1428);border:1px solid rgba(125,170,255,.25);border-radius:20px}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;background:linear-gradient(180deg,#1a2240,#161e3a);z-index:1;border-radius:20px 20px 0 0}
  .modal-header h2{font-size:15px;color:#fff;font-weight:800;display:flex;align-items:center;gap:8px}
  .close-btn{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:700}
  #shopBody,#customBody,#cashBody,#staffBody,#phoneBody,#courierBody,#settingsBody{padding:12px 14px 18px}
  
  .shop-balance{text-align:center;font-size:13px;color:#a9b6d6;margin-bottom:12px}
  .shop-balance b{color:#7dffb0;font-size:18px;font-weight:900}
  .shop-grid{display:flex;flex-direction:column;gap:6px}
  .shop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px}
  .si-ico{width:32px;height:32px;flex-shrink:0}
  .si-info{flex:1;min-width:0}
  .si-name{font-size:13px;font-weight:700;color:#fff}
  .si-stock{font-size:10px;color:#8fa2c8}
  .buy-btn{padding:8px 10px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(180deg,#5ad98a,#33a85b);color:#08200f;font-size:11px;font-weight:800;flex-shrink:0}
  .buy-btn:disabled{background:#333a4d;color:#66708a}
  .buy-btn small{display:block;font-size:9px;opacity:.85}
  
  /* Telefon Görüşmesi */
  .phone-chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .chat-bubble{padding:10px 14px;border-radius:14px;font-size:13px;max-width:85%;line-height:1.4}
  .chat-bubble.cust{background:rgba(255,255,255,.1);color:#fff;align-self:flex-start;border-bottom-left-radius:2px}
  .chat-bubble.you{background:#4aa8ff;color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
  .phone-actions{display:flex;flex-direction:column;gap:8px}
  
  /* Kurye */
  .courier-item{background:rgba(255,255,255,.05);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1)}
  .courier-item.pending{border-color:#ffd84d}
  .courier-item.delivering{border-color:#5ad98a}
  .address-input{width:100%;padding:12px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;margin-top:8px;margin-bottom:8px;outline:none}
  .address-input:focus{border-color:#7dffb0}
  
  /* PREP UI (Sadece Menü) */
  #prepUI{position:fixed;inset:0;z-index:20;pointer-events:none;background:rgba(5,8,18,.6);backdrop-filter:blur(4px)}
  #prepUI > div{pointer-events:auto}
  #recipePanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,400px);max-height:80vh;overflow-y:auto;background:rgba(12,14,28,.98);border:2px solid rgba(255,140,80,.6);border-radius:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.8)}
  #recipePanel .rp-title{font-size:12px;letter-spacing:2px;color:#ffb060;font-weight:900;margin-bottom:10px;text-align:center}
  .recipe-card{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:2px solid rgba(255,255,255,.1);transition:all .15s;cursor:pointer}
  .recipe-card:hover{background:rgba(255,180,80,.15);border-color:rgba(255,180,80,.5)}
  .recipe-card.disabled{opacity:.4;cursor:not-allowed}
  .recipe-card.disabled:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .rc-name{font-size:14px;font-weight:800;color:#fff;margin-bottom:2px}
  .rc-price{font-size:12px;color:#7dffb0;font-weight:700;margin-bottom:6px}
  .rc-layers{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
  .rc-layers svg{width:20px;height:20px}
  .rc-missing{font-size:10px;color:#ff5a5f;font-weight:700}
  .rc-ready{font-size:10px;color:#7dffb0;font-weight:700}
  
  /* Kasa */
  .cash-display{background:rgba(0,0,0,.3);border-radius:12px;padding:12px;margin-bottom:12px}
  .cash-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;color:#a9b6d6}
  .cash-row b{font-size:15px;color:#fff;font-weight:800}
  .cash-row.highlight b{color:#ffd84d;font-size:20px}
  .cash-row.given b{color:#7dffb0}
  .cash-drawer{height:50px;background:linear-gradient(180deg,#8b4a2a,#5a2a1a);border-radius:8px;margin:10px 0;position:relative;overflow:hidden;border:2px solid rgba(0,0,0,.3)}
  .cash-drawer.open .cash-drawer-inner{transform:translateY(0);opacity:1}
  .cash-drawer-inner{position:absolute;inset:0;padding:8px;display:flex;justify-content:space-around;align-items:center;transform:translateY(100%);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(180deg,#a86a3a,#8b4a2a)}
  .cash-bill{width:26px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#1a1400}
  .b1{background:#a8e6a8}.b5{background:#a8c8f0}.b10{background:#ffd84d}.b20{background:#ff9f4d}.b50{background:#ff6b6b}
  .cash-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:7px;background:linear-gradient(180deg,#d4d4d4,#8a8a8a);border-radius:4px}
  .denom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .denom-btn{padding:12px 4px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(180deg,#2a3a5c,#1a2440);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
  .cash-actions{display:flex;gap:8px}
  .cash-actions button{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:800}
  #cashClear{background:rgba(255,255,255,.12);color:#fff}
  #cashConfirm{background:linear-gradient(180deg,#5ad98a,#33a85b);color:#08200f}
  #cashConfirm:disabled{background:#333a4d;color:#66708a}
  
  .custom-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .custom-row label{flex-shrink:0;font-size:12px;color:#a9b6d6;width:90px;font-weight:700}
  .custom-input{flex:1;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:13px;font-weight:700;outline:none}
  
  /* Ayarlar Slider */
  .slider-container {width:100%; margin-top: 10px;}
  input[type=range] {-webkit-appearance: none; width: 100%; background: transparent;}
  input[type=range]::-webkit-slider-thumb {-webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #7dffb0; cursor: pointer; margin-top: -8px;}
  input[type=range]::-webkit-slider-runnable-track {width: 100%; height: 8px; cursor: pointer; background: rgba(255,255,255,.2); border-radius: 4px;}
  
  /* Ekranlar */
  .screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,rgba(60,80,160,.5),rgba(8,10,22,.97) 70%);color:#fff;overflow-y:auto}
  .screen h1{font-size:clamp(24px,7vw,36px);font-weight:900;background:linear-gradient(180deg,#fff,#8fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{padding:13px 30px;border-radius:999px;border:none;cursor:pointer;font-size:15px;font-weight:800;color:#08101f;background:linear-gradient(180deg,#8fe6ff,#4aa8ff);box-shadow:0 8px 30px rgba(74,168,255,.5);margin:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
  .btn:active{transform:scale(.95)}
  .btn.secondary{background:linear-gradient(180deg,#ffd84d,#d4a800);color:#1a1400}
  .btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
  .code-box{font-size:34px;font-weight:900;letter-spacing:8px;padding:18px 24px;border-radius:14px;background:rgba(125,255,176,.15);color:#7dffb0;border:3px solid #7dffb0;font-family:monospace;margin:12px 0}
  .code-input{font-size:28px;font-weight:900;letter-spacing:6px;padding:12px 18px;border-radius:12px;background:rgba(0,0,0,.4);color:#fff;border:2px solid rgba(125,170,255,.5);text-align:center;width:min(260px,80vw);font-family:monospace;text-transform:uppercase;outline:none}
  .role-grid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .role-card{padding:16px 20px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);min-width:120px;position:relative}
  .role-card.selected{border-color:#7dffb0;background:rgba(125,255,176,.15)}
  .role-card.disabled{opacity:.35;cursor:default}
  .role-card svg{width:52px;height:52px;display:block;margin:0 auto 6px}
  .role-card .rc-name{font-size:14px;font-weight:800;color:#fff}
  .lobby-player{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);margin-bottom:6px;width:min(320px,90vw);text-align:left}
  .lobby-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#8fe6ff,#4aa8ff);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#08101f}
  .lobby-name{flex:1;font-size:13px;font-weight:700;color:#fff}
  .lobby-role{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:rgba(125,255,176,.2);color:#7dffb0}
  .lobby-role.chef{background:rgba(180,60,40,.35);color:#ffb8a8}
  .lobby-role.waiter{background:rgba(40,120,180,.35);color:#a8d8ff}
  .lobby-role.courier{background:rgba(140,40,180,.35);color:#e0a8ff}
  .lobby-role.empty{background:rgba(255,255,255,.08);color:#66708a}
  .waiting-dots{font-size:32px;letter-spacing:6px;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.3}}
</style>
</head>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">

  <symbol id="ico-sauce" viewBox="0 0 32 32"><rect x="8" y="8" width="16" height="20" rx="3" fill="#e8b033"/><rect x="11" y="4" width="10" height="6" rx="1" fill="#c9911a"/></symbol>

<script type="module">
import * as THREE from 'three';

function icoHTML(id, size){ return `<svg class="${size==='xl'?'svg-ico xl':'svg-ico'}" viewBox="0 0 32 32"><use href="#ico-${id}"/></svg>`; }

const INGREDIENTS = [
  { id:'bun', name:'Ekmek', cost:20, pack:10, cat:'burger' },
  { id:'patty', name:'Köfte', cost:40, pack:10, cat:'burger' },
  { id:'cheese', name:'Peynir', cost:30, pack:10, cat:'burger' },

  { id:'fries', name:'Patates', cost:20, pack:10, cat:'side' },
  { id:'onionrings', name:'Soğan Halkası', cost:25, pack:10, cat:'side' },
  { id:'cola', name:'Kola', cost:15, pack:10, cat:'side' }
];

const MENUS = {
  klassik: { name:'Klasik Menü', price:160, burger:['bun','patty','lettuce','tomato','sauce'], sides:['fries','cola'], address:'Mavi Ev' },
  sef: { name:'Şef Menü', price:220, burger:['bun','patty','cheese','pickle','sauce','onion'], sides:['fries','cola'], address:'Sarı Ev' },
  double: { name:'Double Menü', price:280, burger:['bun','patty','patty','cheese','sauce','onion'], sides:['onionrings','cola'], address:'Beyaz Ev' },
  cocuk: { name:'Çocuk Menü', price:120, burger:['bun','patty','sauce'], sides:['fries','cola'], address:'Kırmızı Ev' },
  vejetaryen: { name:'Vejetaryen Menü', price:140, burger:['bun','cheese','lettuce','tomato','pickle','sauce'], sides:['fries','cola'], address:'Yeşil Ev' }
};
const MENU_KEYS = Object.keys(MENUS);
const ROLES = { chef: { name:'Şef', icon:'chef' }, waiter: { name:'Garson', icon:'waiter' }, courier: { name:'Kurye', icon:'courier' } };
const VALID_ADDRESSES = ['Mavi Ev', 'Sarı Ev', 'Beyaz Ev', 'Kırmızı Ev', 'Yeşil Ev'];

const ROOM = 14, EYE = 1.65, PLAYER_R = 0.35, MOVE_SPEED = 4.5, INTERACT_DIST = 3.0;
const DELIVERY_DELAY = 10, COOK_TIME = 6, BURNT_TIME = 11, 
      BILLS = [20, 50, 100, 200, 500, 1000];
const COUNTER_Z = -3.6, DOOR_X = 4, DOOR_Z = ROOM/2 - 0.2;
const REGISTER_SPOT = new THREE.Vector3(4, 0, COUNTER_Z + 1.7);
const TABLES = [{ x:-4, z:2.0, occupied:false, id:0 }, { x:0, z:3.0, occupied:false, id:1 }, { x:4, z:2.0, occupied:false, id:2 }];
const SERVING_SLOTS = [new THREE.Vector3(0.3, 1.2, COUNTER_Z), new THREE.Vector3(0.9, 1.2, COUNTER_Z), new THREE.Vector3(1.5, 1.2, COUNTER_Z)];
const STORAGE_COST = 5000;

const game = {
  balance: 2000, stock: {}, customers: [], customerSpawnTimer: 3, deliveries: [], counterItems: [], waste: [], time: 0, ordersDone: 0,
  over: false, running: false, role: null, multiplayer: false, isHost: false, shopName: 'BURGER HOUSE', open: true, neonColor: 0xff5a5f, storageUnlocked: false, players: [],
  staff: { chef: false, waiter: false },
  volume: 0.5,
  phone: { ringing: false, active: false, timer: 120, currentOrder: null, step: 0 },
  courier: { status: 'at_shop', timer: 0 }
};
INGREDIENTS.forEach(i => game.stock[i.id] = 0);

let nextCustomerId = 1, nextItemId = 1;
const player = { pos: new THREE.Vector3(0, 0, -1.5), yaw: Math.PI, pitch: -0.05, bobPhase: 0, bobAmount: 0, held: null };
const grill = { patties: [] };
const interactables = [], colliders = [];
let chefNPC = null, waiterNPC = null, npcTimer = 0;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2d5b8);
scene.fog = new THREE.Fog(0xf2d5b8, 24, 50);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 100);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7050, 1.0));
const sun = new THREE.DirectionalLight(0xfff0c8, 1.6);
sun.position.set(6, 14, 4); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-10, right:10, top:10, bottom:-10, near:1, far:35 });
scene.add(sun, sun.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const neonLight = new THREE.PointLight(0xff5a5f, 2, 6, 2);
neonLight.position.set(0, 2.5, -5); scene.add(neonLight);

function floorTex(){
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#e8d0b0'; g.fillRect(0,0,256,256);
  g.strokeStyle = '#c9a87e'; g.lineWidth = 3;
  for (let i=0;i<=256;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,256); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(256,i); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
function textTex(text, bg, fg='#fff'){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0,0,512,128);
  g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(0,104,512,24);
  g.fillStyle = fg; g.font = '900 52px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 62);
  return new THREE.CanvasTexture(c);
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), new THREE.MeshStandardMaterial({ map: floorTex(), roughness:0.85 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const WALL_H = 4.2; const wallMat = new THREE.MeshStandardMaterial({ color:0xf5ead8, roughness:0.95 });
function addWall(w,h,d,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat); m.position.set(x,y,z); m.receiveShadow = true; scene.add(m); }
addWall(ROOM, WALL_H, 0.3, 0, WALL_H/2, -ROOM/2); addWall(ROOM, WALL_H, 0.3, 0, WALL_H/2, ROOM/2);
addWall(0.3, WALL_H, ROOM, -ROOM/2, WALL_H/2, 0); addWall(0.3, WALL_H, ROOM, ROOM/2, WALL_H/2, 0);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), new THREE.MeshStandardMaterial({ color:0xfff8f0, roughness:1, side:THREE.DoubleSide }));
ceiling.rotation.x = Math.PI/2; ceiling.position.y = WALL_H; scene.add(ceiling);

for (let i=-1;i<=1;i++) for (let j=-1;j<=1;j++){
  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 1.6), new THREE.MeshBasicMaterial({ color:0xfff9e8 }));
  panel.position.set(i*4.5, WALL_H-0.04, j*4.5); scene.add(panel);
  const pl = new THREE.PointLight(0xfff0d0, 8, 12, 2); pl.position.set(i*4.5, WALL_H-0.5, j*4.5); scene.add(pl);
}

const entranceDoor = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3.0, 0.15), new THREE.MeshStandardMaterial({ color:0x8b4a2a }));
entranceDoor.position.set(DOOR_X, 1.5, DOOR_Z); scene.add(entranceDoor);
const signPlane = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.2), new THREE.MeshBasicMaterial({ map: textTex('BURGER HOUSE', '#ff5a5f') }));
signPlane.position.set(0, 3.2, -ROOM/2 + 0.2); scene.add(signPlane);

const counter = new THREE.Group(); counter.position.set(0, 0, COUNTER_Z);
const cb = new THREE.Mesh(new THREE.BoxGeometry(11, 1.05, 0.9), new THREE.MeshStandardMaterial({ color:0x6b3a1a }));
cb.position.y = 0.525; cb.castShadow = true; counter.add(cb);
const ct = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.1, 1.0), new THREE.MeshStandardMaterial({ color:0xf4f0e8 }));
ct.position.y = 1.1; counter.add(ct); scene.add(counter);
colliders.push({ minX:-5.6, maxX:5.6, minZ:COUNTER_Z-0.5, maxZ:COUNTER_Z+0.5 });

const storageGroup = new THREE.Group(); storageGroup.position.set(4, 0, COUNTER_Z - 2.2);
const sd = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.6, 0.15), new THREE.MeshStandardMaterial({ color:0x5a3a1a })); sd.position.y = 1.3; storageGroup.add(sd);
const lock = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.1), new THREE.MeshStandardMaterial({ color:0xffd84d })); lock.position.set(0, 1.4, 0.1); storageGroup.add(lock); storageGroup.userData.lockMesh = lock;
storageGroup.userData.interactType = 'storage'; scene.add(storageGroup); interactables.push(storageGroup);

const grillGroup = new THREE.Group(); grillGroup.position.set(-2.8, 1.15, COUNTER_Z);
const gs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.75), new THREE.MeshStandardMaterial({ color:0x1a1a1a, metalness:0.7 })); grillGroup.add(gs);
grillGroup.userData.interactType = 'grill'; scene.add(grillGroup); interactables.push(grillGroup);

const assemblyGroup = new THREE.Group(); assemblyGroup.position.set(-1.2, 1.15, COUNTER_Z);
const board = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 0.8), new THREE.MeshStandardMaterial({ color:0xd9b88a })); board.position.y = 0.02; assemblyGroup.add(board);
assemblyGroup.userData.interactType = 'assembly'; scene.add(assemblyGroup); interactables.push(assemblyGroup);

let actx = null; function initAudio(){ if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function beep(freq, dur=0.1, type='sine', vol=0.07){
  if (!actx || game.volume <= 0) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(vol * game.volume, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function errorBeep(){ beep(180, 0.18, 'sawtooth', 0.09); }
function successChime(){ beep(660, 0.08, 'triangle', 0.08); setTimeout(()=>beep(880, 0.1, 'triangle', 0.08), 70); setTimeout(()=>beep(1180, 0.14, 'triangle', 0.07), 150); }
function playSound(type) {
  if (type === 'click') beep(800, 0.05, 'sine', 0.05);
  if (type === 'cash') beep(1000, 0.15, 'sine', 0.08);
  if (type === 'phone') { beep(440, 0.2, 'square', 0.1); setTimeout(()=>beep(440, 0.2, 'square', 0.1), 250); }
}

const joy = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const look = { active:false, id:null, lx:0, ly:0 };
const keys = {};
const joyBase = $('joyBase'), joyKnob = $('joyKnob');

function onDown(e){
  if (!game.running || game.over || !$('prepUI').classList.contains('hidden') || e.target.closest('.screen') || e.target.closest('#prepUI') || document.querySelector('.modal:not(.hidden)')) return;
  const x = e.clientX, y = e.clientY;
  if (e.pointerType === 'touch' && x < innerWidth * 0.5){
    if (joy.active) return; joy.active = true; joy.id = e.pointerId; joy.ox = x; joy.oy = y; joy.x = 0; joy.y = 0;
    joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px'; joyBase.classList.add('on'); joyKnob.style.transform = 'translate(-50%,-50%)';
  } else {
    if (look.active) return; look.active = true; look.id = e.pointerId; look.lx = x; look.ly = y;
  }
}
function onMove(e){
  if (e.pointerId === joy.id && joy.active){
    const dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const max = 55; let len = Math.hypot(dx, dy);
    let nx = dx, ny = dy; if (len > max){ nx = dx/len*max; ny = dy/len*max; }
    joy.x = nx/max; joy.y = ny/max; joyKnob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
  } else if (e.pointerId === look.id && look.active){
    const dx = e.clientX - look.lx, dy = e.clientY - look.ly; look.lx = e.clientX; look.ly = e.clientY;
    player.yaw -= dx * 0.0038; player.pitch -= dy * 0.0038; player.pitch = Math.max(-1.15, Math.min(1.15, player.pitch));
  }
}
function onUp(e){ if (e.pointerId === joy.id){ joy.active=false; joy.id=null; joy.x=0; joy.y=0; joyBase.classList.remove('on'); } if (e.pointerId === look.id){ look.active=false; look.id=null; } }
addEventListener('pointerdown', onDown, { passive:false }); addEventListener('pointermove', onMove, { passive:false }); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE') tryInteract(); }); addEventListener('keyup', e => { keys[e.code] = false; });

function makeOrderSprite(c){

function updateCustomers(dt){
  for (let i = game.customers.length - 1; i >= 0; i--){
    const c = game.customers[i]; const g = c.group;
    if (c.state === 'entering' || c.state === 'toRegister' || c.state === 'leaving'){
      const dx = c.target.x - g.position.x, dz = c.target.z - g.position.z; const dist = Math.hypot(dx, dz);
      if (dist > 0.1){
        const step = Math.min(dist, (c.state === 'leaving' ? 3.5 : 3.2) * dt);
        g.position.x += dx/dist * step; g.position.z += dz/dist * step; g.rotation.y = Math.atan2(dx, dz);
        c.bob += dt * 9; g.position.y = Math.abs(Math.sin(c.bob)) * 0.06;
      } else {
        g.position.y = 0;
        if (c.state === 'entering') c.state = 'waiting';
        else if (c.state === 'toRegister') c.state = 'paying';
        else if (c.state === 'leaving'){ scene.remove(g); interactables.splice(interactables.indexOf(g), 1); c.table.occupied = false; game.customers.splice(i, 1); }
        updateOrdersPanel();
      }
    } else if (c.state === 'waiting' || c.state === 'paying'){
      c.angerTimer += dt;
      if (c.state === 'waiting' && c.angerTimer > 60){
        c.state = 'leaving'; c.target = new THREE.Vector3(DOOR_X, 0, DOOR_Z + 1);
        if (c.sprite){ g.remove(c.sprite); c.sprite = null; } updateOrdersPanel();
      }
    } else if (c.state === 'eating'){
      c.eatTimer -= dt;
      if (c.eatTimer <= 0){
        c.state = 'toRegister'; c.target = new THREE.Vector3(REGISTER_SPOT.x, 0, REGISTER_SPOT.z);
        const price = MENUS[c.menu].price; const paid = BILLS.find(b => b >= price) || 1000;
        c.cash = { price, paid, changeNeeded: paid - price, changeGiven: 0 };
        if (c.sprite){ g.remove(c.sprite); c.sprite = null; } updateOrdersPanel();
      }
    } else if (c.state === 'angry'){
      c.angerTimer -= dt; if (c.angerTimer <= 0){ c.state = 'leaving'; c.target = new THREE.Vector3(DOOR_X, 0, DOOR_Z + 1); }
    }
  }
}

// Çoklu Izgara Mantığı
function updateGrill(dt){
  for (let i = grill.patties.length - 1; i >= 0; i--) {
    const p = grill.patties[i];
    p.timer += dt;
    if (p.timer < 3) p.mesh.material.color.setHex(0xe8a0a0);
    else if (p.timer < COOK_TIME) p.mesh.material.color.copy(new THREE.Color(0xe8a0a0).lerp(new THREE.Color(0x8b4513), (p.timer - 3) / 3));
    else if (p.timer < BURNT_TIME) {
      if (p.state === 'cooking') { p.state = 'ready'; beep(900, 0.1); }
      p.mesh.material.color.setHex(0x8b4513);
    } else {
      if (p.state !== 'burnt') { p.state = 'burnt'; errorBeep(); }
      p.mesh.material.color.setHex(0x1a1a1a);
    }
  }
}

function handleGrill(){
  if (!canCook()){ hint('Bu iş şefe ait'); return; }
  if (player.held) { hint('Elinde bir şey var'); return; }

  const readyIdx = grill.patties.findIndex(p => p.state === 'ready');
  if (readyIdx !== -1) {
    const p = grill.patties.splice(readyIdx, 1)[0];
    scene.remove(p.mesh);
    player.held = { kind: 'patty' };
    updateHeldUI(); beep(800,0.1);
    return;
  }

  if (grill.patties.length < 4) {
    if (game.stock.patty <= 0) { hint('Köfte yok'); errorBeep(); return; }
    game.stock.patty--; updateStockUI();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.07, 18), new THREE.MeshStandardMaterial({ color:0xe8a0a0 }));
    const offsets = [[-0.25, -0.15], [0.25, -0.15], [-0.25, 0.15], [0.25, 0.15]];
    const pos = offsets[grill.patties.length];
    mesh.position.set(pos[0], 0.14, pos[1]);
    mesh.castShadow = true;
    grillGroup.add(mesh);
    grill.patties.push({ mesh, timer: 0, state: 'cooking' });
    beep(400, 0.1);
  } else {
    hint('Izgara dolu');
  }
}

// NPC Yapay Zekası
function updateNPCs(dt) {
  if (!game.running) return;
  npcTimer += dt;
  if (npcTimer < 2.0) return;
  npcTimer = 0;

  if (game.staff.chef) {
    if (grill.patties.length < 4 && game.stock.patty > 0) {
      game.stock.patty--; updateStockUI();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.07, 18), new THREE.MeshStandardMaterial({ color:0xe8a0a0 }));
      const offsets = [[-0.25, -0.15], [0.25, -0.15], [-0.25, 0.15], [0.25, 0.15]];
      const pos = offsets[grill.patties.length];
      mesh.position.set(pos[0], 0.14, pos[1]);
      grillGroup.add(mesh);
      grill.patties.push({ mesh, timer: 0, state: 'cooking' });
    }
    const waiting = game.customers.find(c => c.state === 'waiting');
    if (waiting && game.counterItems.length < 3) {
      const M = MENUS[waiting.menu];
      let canMake = true;
      const readyPatty = grill.patties.find(p => p.state === 'ready');
      if (!readyPatty && game.stock.patty <= 0) canMake = false;
      const otherIngs = M.burger.filter(x => x !== 'patty');
      for (const ing of otherIngs) if (game.stock[ing] <= 0) canMake = false;
      for (const ing of M.sides) if (game.stock[ing] <= 0) canMake = false;

      if (canMake) {
        if (readyPatty) { scene.remove(readyPatty.mesh); grill.patties.splice(grill.patties.indexOf(readyPatty), 1); }
        else game.stock.patty--;
        for (const ing of otherIngs) game.stock[ing]--;
        for (const ing of M.sides) game.stock[ing]--;
        updateStockUI();
        game.counterItems.push({ id: nextItemId++, menuKey: waiting.menu, price: M.price });
        renderCounterItems();
        sendAction({ action: 'addMenu', menu: game.counterItems[game.counterItems.length - 1] });
      }
    }
  }

  if (game.staff.waiter) {
    const item = game.counterItems[0];
    if (item) {
      const cust = game.customers.find(c => c.state === 'waiting' && c.menu === item.menuKey);
      if (cust) {
        game.counterItems.shift(); renderCounterItems();
        cust.state = 'eating'; cust.eatTimer = 3;
        if (cust.sprite) { cust.group.remove(cust.sprite); cust.sprite = null; }
        updateOrdersPanel();
        sendAction({ action: 'serve', customerId: cust.id });
        sendAction({ action: 'takeMenu', menuId: item.id });
      }
    }
    const paying = game.customers.find(c => c.state === 'paying');
    if (paying && paying.cash) {
      game.balance += paying.cash.price; updateBalanceUI();

function makeBurger(menuKey) {
  const M = MENUS[menuKey];
  let hasPattyInHand = player.held && player.held.kind === 'patty';

  if (stockPattyNeeded > game.stock.patty) { hint('Yetersiz köfte!'); errorBeep(); return; }
  const otherBurgerIngs = M.burger.filter(x => x !== 'patty');
  for (const ing of otherBurgerIngs) if (game.stock[ing] <= 0) { hint('Eksik: ' + INGREDIENTS.find(i => i.id === ing).name); errorBeep(); return; }
  for (const ing of M.sides) if (game.stock[ing] <= 0) { hint('Eksik: ' + INGREDIENTS.find(i => i.id === ing).name); errorBeep(); return; }

let currentTarget = null;
function findInteractable(){
  const camPos = camera.position; const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
  let best = null, bestScore = 0;
  for (const obj of interactables){
    if (!obj.parent) continue;
    const wp = obj.getWorldPosition(new THREE.Vector3()); const dx = wp.x - camPos.x, dz = wp.z - camPos.z; const dist = Math.hypot(dx, dz);
    if (dist > INTERACT_DIST) continue;
    if (dist < 0.5) return obj;
    const dot = forward.x * (dx/dist) + forward.z * (dz/dist); if (dot < 0.2) continue;
    const score = dot * (1 - dist/INTERACT_DIST); if (score > bestScore){ bestScore = score; best = obj; }
  }
  return best;
}
function tryInteract(){
  if (!game.running || game.over || !$('prepUI').classList.contains('hidden') || document.querySelector('.modal:not(.hidden)')) return;
  const target = findInteractable(); if (!target) return;
  const type = target.userData.interactType;
  if (type === 'grill') handleGrill(); else if (type === 'assembly') startPrep(); else if (type === 'computer') openShop();
  else if (type === 'serving') takeFromCounter(); else if (type === 'register') handleRegister();
  else if (type === 'box') pickupBox(target); else if (type === 'customer') serveCustomer(target.userData.customer);
  else if (type === 'storage') handleStorage(); else if (type === 'cat') feedCat(target);
}

function resolveCollisions(pos){
  const lim = ROOM/2 - 0.45; pos.x = Math.max(-lim, Math.min(lim, pos.x)); pos.z = Math.max(-lim, Math.min(lim, pos.z));
  for (const b of colliders){
    const cx = Math.max(b.minX, Math.min(pos.x, b.maxX)), cz = Math.max(b.minZ, Math.min(pos.z, b.maxZ));
    let dx = pos.x - cx, dz = pos.z - cz, d2 = dx*dx + dz*dz;
    if (d2 < PLAYER_R*PLAYER_R){
      if (d2 > 1e-8){ const d = Math.sqrt(d2); pos.x = cx + dx/d*PLAYER_R; pos.z = cz + dz/d*PLAYER_R; }
      else { const toL = pos.x - b.minX, toR = b.maxX - pos.x, toB = pos.z - b.minZ, toT = b.maxZ - pos.z; const m = Math.min(toL, toR, toB, toT); if (m === toL) pos.x = b.minX - PLAYER_R; else if (m === toR) pos.x = b.maxX + PLAYER_R; else if (m === toB) pos.z = b.minZ - PLAYER_R; else pos.z = b.maxZ + PLAYER_R; }
    }
  }
}
function updatePlayer(dt){
  if (!$('prepUI').classList.contains('hidden')) return;
  let mx = joy.x, my = joy.y; if (keys['KeyW'] || keys['ArrowUp']) my -= 1; if (keys['KeyS'] || keys['ArrowDown']) my += 1; if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1; if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  const mag = Math.hypot(mx, my); if (mag > 1){ mx /= mag; my /= mag; }
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3().addScaledVector(right, mx).addScaledVector(fwd, -my); const len = move.length();
  if (len > 0.02){ move.multiplyScalar(1 / Math.max(1, len)); player.pos.x += move.x * MOVE_SPEED * dt; player.pos.z += move.z * MOVE_SPEED * dt; player.bobPhase += dt * 10; player.bobAmount += (1 - player.bobAmount) * Math.min(1, dt*8); }
  else { player.bobAmount += (0 - player.bobAmount) * Math.min(1, dt*8); }
  resolveCollisions(player.pos);
  camera.position.set(player.pos.x, EYE + Math.sin(player.bobPhase) * 0.04 * player.bobAmount, player.pos.z); camera.rotation.set(player.pitch, player.yaw, 0);
  sun.position.set(player.pos.x + 6, 14, player.pos.z + 4); sun.target.position.set(player.pos.x, 0, player.pos.z);
}

function broadcastLobby(){ if (conn && conn.open) conn.send({ type: 'lobby', players: game.players }); }
function sendAction(act){ if (conn && conn.open) conn.send({ type: 'action', action: act }); }

function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); if (id) $(id).classList.remove('hidden'); }

$('soloBtn').onclick = () => { game.multiplayer = false; game.isHost = false; startGame(); };
$('multiBtn').onclick = () => { showScreen('lobbyScreen'); renderLobbyChoice(); };
$('lobbyBackBtn').onclick = () => { if (peer) peer.destroy(); conn = null; showScreen('menuScreen'); };

function renderLobbyChoice(){
  $('lobbyInfo').textContent = 'Oda oluştur veya katıl'; $('lobbyPlayers').innerHTML = `<button class="btn" id="hostBtn">Oda Oluştur</button><button class="btn secondary" id="joinBtn">Odaya Katıl</button>`;
  $('lobbyRolePicker').innerHTML = ''; $('lobbyReadyBtn').classList.add('hidden');
  $('hostBtn').onclick = () => {
    const code = genCode(); $('roomCode').textContent = code; showScreen('hostScreen'); game.isHost = true; game.multiplayer = true;
    peer = new Peer('burger-mp-' + code);
    peer.on('open', () => { game.players = [{ id: 'host', name: 'Ev Sahibi', role: null, ready: false }]; });
    peer.on('connection', c => {
      conn = c; conn.on('open', () => {
        conn.on('data', data => {
          if (data.type === 'join'){ game.players.push({ id: 'guest', name: 'Misafir', role: null, ready: false }); broadcastLobby(); showLobby(); }
          if (data.type === 'role'){ const p = game.players.find(x => x.id === 'guest'); if (p) p.role = data.role; broadcastLobby(); showLobby(); }
          if (data.type === 'ready'){ const p = game.players.find(x => x.id === 'guest'); if (p) p.ready = true; broadcastLobby(); showLobby(); if (game.players.length === 2 && game.players.every(x => x.ready && x.role)) startMultiplayerGame(); }
          if (data.type === 'action') applyRemoteAction(data.action);
          if (data.type === 'pos') { 
            if (!remoteMesh) createRemotePlayerMesh();
            updateRemotePlayer(data.pos, data.yaw); 
          }
        });
      });
    });
  };
  $('joinBtn').onclick = () => { showScreen('joinScreen'); $('codeInput').value = ''; $('joinError').textContent = ''; };
}

$('hostCancelBtn').onclick = $('joinBackBtn').onclick = () => { if (peer) peer.destroy(); conn = null; showScreen('lobbyScreen'); renderLobbyChoice(); };
$('joinConfirmBtn').onclick = () => {
  const code = $('codeInput').value.trim().toUpperCase(); if (code.length !== 6) return;
  game.isHost = false; game.multiplayer = true;
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('burger-mp-' + code);
    conn.on('open', () => {
      conn.send({ type: 'join' });
      conn.on('data', data => {
        if (data.type === 'lobby'){ game.players = data.players; showLobby(); }
        if (data.type === 'start'){ 
          game.players = data.players; 
          const me = game.players.find(x => x.id === 'guest'); if (me) game.role = me.role; 
          startGame(); 
        }
        if (data.type === 'state') applyState(data.state);
      });
    });
  });
  peer.on('error', () => { $('joinError').textContent = 'Bağlantı hatası!'; });
};

function showLobby(){
  showScreen('lobbyScreen'); $('lobbyInfo').textContent = 'Lobi';
  $('lobbyPlayers').innerHTML = game.players.map(p => `<div class="lobby-player"><div class="lobby-avatar">${(p.name[0]||'?').toUpperCase()}</div><div class="lobby-name">${p.name} ${p.ready?'✓':''}</div><div class="lobby-role ${p.role||'empty'}">${p.role?ROLES[p.role].name:'Rol Seç'}</div></div>`).join('');
  const me = game.players.find(p => p.id === (game.isHost ? 'host' : 'guest'));
  $('lobbyRolePicker').innerHTML = Object.entries(ROLES).map(([rid, rd]) => {
    const taken = game.players.some(p => p.id !== (game.isHost?'host':'guest') && p.role === rid);
    const sel = me?.role === rid;
    return `<div class="role-card ${sel?'selected':''} ${taken?'disabled':''}" data-role="${rid}">${icoHTML(rd.icon, 'xl')}<div class="rc-name">${rd.name}</div></div>`;
  }).join('');
  $('lobbyRolePicker').querySelectorAll('.role-card:not(.disabled)').forEach(card => card.onclick = () => {
    const role = card.dataset.role;
    if (game.isHost){ const p = game.players.find(x => x.id === 'host'); if (p) p.role = role; broadcastLobby(); showLobby(); }
    else { conn.send({ type: 'role', role }); }
  });
  if (me?.role){
    $('lobbyReadyBtn').classList.remove('hidden'); $('lobbyReadyBtn').textContent = me.ready ? 'BEKLENİYOR...' : 'HAZIR'; $('lobbyReadyBtn').disabled = me.ready;
    $('lobbyReadyBtn').onclick = () => {
      if (game.isHost){ const p = game.players.find(x => x.id === 'host'); if (p) p.ready = true; broadcastLobby(); showLobby(); if (game.players.length === 2 && game.players.every(x => x.ready && x.role)) startMultiplayerGame(); }
      else { conn.send({ type: 'ready' }); }
    };
  } else $('lobbyReadyBtn').classList.add('hidden');
}

function createRemotePlayerMesh() {
  if (remoteMesh) return;
  const otherPlayer = game.players.find(p => p.id !== (game.isHost ? 'host' : 'guest'));
  const otherRole = otherPlayer && otherPlayer.role ? otherPlayer.role : 'waiter';
  remoteMesh = makeHumanoid(0x6ba8ff, 0xffd9b3, otherRole);
  remoteMesh.position.set(0, 0, -1.5);
  scene.add(remoteMesh);
}

function applyRemoteAction(act){
  if (act.action === 'addMenu'){ if (!game.counterItems.find(c => c.id === act.menu.id)) game.counterItems.push(act.menu); renderCounterItems(); }
  if (act.action === 'takeMenu'){ const i = game.counterItems.findIndex(c => c.id === act.menuId); if (i>=0) game.counterItems.splice(i,1); renderCounterItems(); }
  if (act.action === 'serve'){ const c = game.customers.find(x => x.id === act.customerId); if (c && c.state==='waiting'){ c.state='eating'; c.eatTimer=3; if(c.sprite){c.group.remove(c.sprite);c.sprite=null;} updateOrdersPanel(); } }
  if (act.action === 'pay'){ const c = game.customers.find(x => x.id === act.customerId); if (c){ game.balance += act.amount; updateBalanceUI(); c.state='leaving'; c.target=new THREE.Vector3(DOOR_X,0,DOOR_Z+1); if(c.sprite){c.group.remove(c.sprite);c.sprite=null;} updateOrdersPanel(); } }
  if (act.action === 'orderIngredient'){ const ING = INGREDIENTS.find(x => x.id === act.id); if (ING){ game.balance -= act.cost; updateBalanceUI(); game.deliveries.push({ id: ING.id, quantity: ING.pack, arriveTime: game.time + DELIVERY_DELAY }); } }
  if (act.action === 'pickupBox'){ game.stock[act.id] += act.quantity; updateStockUI(); }
  if (act.action === 'hireStaff'){ game.staff[act.type] = true; spawnNPCs(); }
}
function buildState(){ return { balance: game.balance, stock: {...game.stock}, counterItems: game.counterItems, staff: game.staff, grill: grill.patties.map(p => ({state: p.state, timer: p.timer, x: p.mesh.position.x, z: p.mesh.position.z})), customers: game.customers.map(c=>({id:c.id,menu:c.menu,state:c.state,x:c.group.position.x,z:c.group.position.z,cash:c.cash})) }; }
function applyState(s){
  game.balance = s.balance; game.stock = {...s.stock}; game.counterItems = s.counterItems; game.staff = s.staff;
  updateBalanceUI(); updateStockUI(); renderCounterItems(); spawnNPCs();
  
  for (const p of grill.patties) scene.remove(p.mesh);
  grill.patties = [];
  for (const sp of s.grill) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.07, 18), new THREE.MeshStandardMaterial({ color:0xe8a0a0 }));
    mesh.position.set(sp.x, 0.14, sp.z);
    grillGroup.add(mesh);
    grill.patties.push({ mesh, timer: sp.timer, state: sp.state });
  }

  for (let i=game.customers.length-1; i>=0; i--){ const c = game.customers[i]; if (!s.customers.find(x => x.id === c.id)){ scene.remove(c.group); interactables.splice(interactables.indexOf(c.group),1); c.table.occupied=false; game.customers.splice(i,1); } }
  for (const sc of s.customers){ let c = game.customers.find(x => x.id === sc.id); if (!c){ const free = TABLES.find(t=>!t.occupied); if(free){ const g = makeHumanoid(0xffffff, 0xffd9b3, null); g.position.set(sc.x,0,sc.z); scene.add(g); c = { id: sc.id, group: g, table: free, menu: sc.menu, state: sc.state, target: new THREE.Vector3(sc.x,0,sc.z), bob:0, eatTimer:0, sprite: null, cash: sc.cash }; free.occupied=true; g.userData={interactType:'customer',customer:c}; interactables.push(g); game.customers.push(c); } } else { c.state = sc.state; c.cash = sc.cash; c.group.position.set(sc.x,0,sc.z); } }
  updateOrdersPanel();
}
function updateRemotePlayer(pos, yaw){ if (remoteMesh){ remoteMesh.position.set(pos.x, 0, pos.z); remoteMesh.rotation.y = yaw; } }

function startGame(){
  if (game.running) return;
  initAudio(); game.balance = 2000; INGREDIENTS.forEach(i => game.stock[i.id] = 0);
  game.customers = []; game.customerSpawnTimer = 3; game.deliveries = []; game.counterItems = []; game.time = 0; game.running = true; game.over = false;
  game.staff = { chef: false, waiter: false };
  game.phone = { ringing: false, active: false, timer: 120, currentOrder: null, step: 0 };
  game.courier = { status: 'at_shop', timer: 0 };
  
  if (chefNPC) { scene.remove(chefNPC); chefNPC = null; }
  if (waiterNPC) { scene.remove(waiterNPC); waiterNPC = null; }
  if (remoteMesh) { scene.remove(remoteMesh); remoteMesh = null; }
  for (const p of grill.patties) scene.remove(p.mesh);
  grill.patties = [];
  
  for (const obj of [...interactables]) if (obj.userData.interactType === 'box' || obj.userData.interactType === 'customer'){ scene.remove(obj); interactables.splice(interactables.indexOf(obj),1); }
  TABLES.forEach(t => t.occupied = false); player.held = null; renderCounterItems(); endPrep();
  player.pos.set(game.role === 'waiter' ? 2 : -1.5, 0, -1.5); player.yaw = Math.PI;
  showScreen(null); ['shopModal','cashModal','customModal','staffModal','phoneModal','courierModal','settingsModal'].forEach(id => $(id).classList.add('hidden')); updateBalanceUI(); updateStockUI(); updateRolePill(); updateOrdersPanel(); updateHeldUI();
  
  if (game.multiplayer && game.role){ 
    hint(`${ROLES[game.role].name} olarak oynuyorsun`); 
    createRemotePlayerMesh();
  }
  if (!game.multiplayer) $('staffBtn').classList.remove('hidden'); else $('staffBtn').classList.add('hidden');
}

function endGame(){ game.running = false; game.over = true; ['shopModal','cashModal','customModal','staffModal','phoneModal','courierModal','settingsModal'].forEach(id => $(id).classList.add('hidden')); $('prompt').classList.add('hidden'); $('interactBtn').classList.add('hidden'); $('staffBtn').classList.add('hidden'); endPrep(); $('finalMoney').textContent = game.balance + ' TL'; $('endScreen').classList.remove('hidden'); }
$('againBtn').onclick = () => { $('endScreen').classList.add('hidden'); startGame(); };
$('quitBtn').onclick = endGame;

let lastT = performance.now();
function animate(now){
  requestAnimationFrame(animate); const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (game.running && !game.over){
    game.time += dt;
    if (!document.querySelector('.modal:not(.hidden)')){
      updatePlayer(dt); updateCustomers(dt); updateGrill(dt); updateNPCs(dt); updateTimers(dt); updatePrompt();
      
      if (game.isHost || !game.multiplayer){
        if (game.customers.length < TABLES.length && game.open && !game.phone.ringing){ game.customerSpawnTimer -= dt; if (game.customerSpawnTimer <= 0){ trySpawnCustomer(); game.customerSpawnTimer = 4 + Math.random()*3; } }
        for (const d of game.deliveries) if (!d.box && game.time >= d.arriveTime) spawnDeliveryBox(d);
      }
      if (game.multiplayer && game.isHost && conn && conn.open && now - lastSync > 100){ conn.send({ type: 'state', state: buildState() }); lastSync = now; }
      if (game.multiplayer && conn && conn.open && now - (game._lastPos || 0) > 100){ 
        conn.send({ type: 'pos', pos: { x: player.pos.x, z: player.pos.z }, yaw: player.yaw }); 
        game._lastPos = now; 
      }
    }
    if (hintTimer > 0){ hintTimer -= dt; if (hintTimer <= 0) $('hint').classList.remove('show'); }
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(animate);
</script>
