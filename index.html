<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Özel Rota Navigasyon</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 40px;
            color: #4285F4;
            font-weight: 700;
        }
        .nav-btn {
            width: 100%;
            padding: 22px;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #222831;
            border: 2px solid #393e46;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .nav-btn:active {
            transform: scale(0.97);
            background-color: #4285F4;
            border-color: #4285F4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ÖZEL ROTA</h1>
        
        <!-- Eve Git Butonu (Özel Rota Linki) -->
        <button class="nav-btn" onclick="startCustomNav()">
            🏠 Eve Git (Özel Rota)
        </button>
        
        <!-- İşe Git Butonu -->
        <button class="nav-btn" onclick="startWorkNav()">
            💼 İşe Git (Özel Rota)
        </button>
    </div>

    <script>
        function startCustomNav() {
            // Tam olarak istediğin özel rota linki doğrudan buraya sabitlendi
            const url = "https://www.google.com/maps/dir/40.7943456,30.3597422/hendek+ye%C5%9Filyurt+orta+okulu,+K%C3%BCp%C3%A7%C3%BCler,+3.+Sk.+No:4,+54200+Erenler%2FSakarya/@40.7994956,30.3411245,11z/am=t/data=!4m9!4m8!1m1!4e1!1m5!1m1!1s0x409df2ba3871a9f1:0x45caf5636d0c4911!2m2!1d30.6339677!2d40.845103?entry=tts&g_ep=EgoyMDI2MDkxNi4wIPu8ASoASAFQAw%3D%3D";
            window.location.href = url;
        }

        function startWorkNav() {
            // İstersen iş için de benzer özel rota URL'sini buraya ekleyebilirsin
            const url = "https://www.google.com/maps/dir/40.7943456,30.3597422/hendek+ye%C5%9Filyurt+orta+okulu,+K%C3%BCp%C3%A7%C3%BCler,+3.+Sk.+No:4,+54200+Erenler%2FSakarya/@40.7994956,30.3411245,11z/am=t/data=!4m9!4m8!1m1!4e1!1m5!1m1!1s0x409df2ba3871a9f1:0x45caf5636d0c4911!2m2!1d30.6339677!2d40.845103?entry=tts&g_ep=EgoyMDI2MDkxNi4wIPu8ASoASAFQAw%3D%3D";
            window.location.href = url;
        }
    </script>
</body>
</html>
